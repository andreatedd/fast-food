<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard Ristoratore - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container-fluid">
		<a class="navbar-brand fw-bold" href="#">
			<i class="bi bi-shop"></i> <span id="nomeRistoranteNav">Caricamento...</span>
		</a>
		<div class="dropdown">
			<button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
				<i class="bi bi-person-circle me-1"></i> Area Ristoratore
			</button>
			<ul class="dropdown-menu dropdown-menu-end shadow">
				<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Utente</a>
				</li>
				<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni
					Locale</a></li>
				<li>
					<hr class="dropdown-divider">
				</li>
				<li><a class="dropdown-item text-danger" href="#" onclick="esci()"><i
						class="bi bi-box-arrow-right me-2"></i> Esci</a></li>
			</ul>
		</div>
	</div>
</nav>

<!--Menù-->
<div class="container mt-5">
	<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
		<h2 class="m-0 fw-bold">Il tuo Menù</h2>
		<div>
			<button type="button" class="btn btn-outline-danger" onclick="apriModalePerNuovo()">
				<i class="bi bi-plus-lg"></i> Crea Piatto
			</button>
			<button type="button" class="btn btn-danger shadow-sm" data-bs-toggle="modal"
			        data-bs-target="#catalogoModal" onclick="popolaModaleCatalogo()">
				<i class="bi bi-journal-plus"></i> Scegli dal Catalogo
			</button>
		</div>
	</div>

	<div id="messaggio-vuoto" class="text-center text-muted my-5 d-none">
		<i class="bi bi-journal-x display-3 opacity-50"></i>
		<h4 class="mt-3">Il tuo menù è vuoto!</h4>
		<p>Aggiungi piatti dal catalogo o creane di personalizzati per iniziare a vendere.</p>
	</div>

	<div class="row" id="contenitore-piatti"></div>

	<div class="position-fixed bottom-0 end-0 p-4 z-3">
		<button type="button" class="btn btn-success btn-lg shadow-lg fw-bold rounded-pill px-4" id="btnSalvaMenu">
			<i class="bi bi-cloud-arrow-up me-2"></i> Salva Menù Online
		</button>
	</div>
</div>

<!--Piatto menu-->
<template id="modello-piatto">
	<div class="col-md-4 col-lg-3 mb-4">
		<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
			<img src="" class="card-img-top foto-piatto" alt="Foto piatto" style="height: 180px; object-fit: cover;">
			<div class="card-body d-flex flex-column">
				<div class="d-flex justify-content-between align-items-start mb-2">
					<h5 class="card-title nome-piatto mb-0 fw-bold"></h5>
				</div>
				<span class="badge bg-danger tipologia-piatto align-self-start mb-2"></span>
				<h5 class="text-success fw-bold prezzo-piatto"></h5>
				<p class="card-text ingredienti-piatto small text-muted flex-grow-1"></p>
				<div class="d-flex justify-content-end mt-3 border-top pt-3">
					<button class="btn btn-sm btn-outline-secondary me-2 btn-modifica"><i class="bi bi-pencil"></i>
					</button>
					<button class="btn btn-sm btn-outline-danger btn-rimuovi"><i class="bi bi-trash"></i></button>
				</div>
			</div>
		</div>
	</div>
</template>

<!--Modale catalogo-->
<div class="modal fade" id="catalogoModal" tabindex="-1">
	<div class="modal-dialog modal-lg modal-dialog-scrollable">
		<div class="modal-content border-0 rounded-4">
			<div class="modal-header bg-danger text-white border-0">
				<h5 class="modal-title">Seleziona dal Catalogo Globale</h5>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body p-0">
				<div class="list-group list-group-flush" id="lista-catalogo"></div>
				<template id="modello-elemento-catalogo">
					<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
						<div class="d-flex align-items-center">
							<img src="" class="rounded-3 me-3 foto-catalogo"
							     style="width: 60px; height: 60px; object-fit: cover;">
							<div>
								<h6 class="mb-1 fw-bold nome-catalogo"></h6>
								<small class="text-muted tipologia-catalogo"></small>
							</div>
						</div>
						<button class="btn btn-sm btn-danger rounded-pill px-3 btn-aggiungi-catalogo">
							<i class="bi bi-plus-lg"></i>
						</button>
					</div>
				</template>
			</div>
		</div>
	</div>
</div>

<!--Modale piatto-->
<div class="modal fade" id="modalPiatto" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content border-0 rounded-4">
			<div class="modal-header border-0 pb-0">
				<h5 class="modal-title fw-bold" id="modalPiattoLabel">Gestione Piatto</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body">
				<form id="formPiatto">
					<input type="hidden" id="piattoIndice" value="-1">
					<div class="mb-3">
						<label class="form-label small fw-bold text-muted">Nome Piatto</label>
						<input type="text" class="form-control bg-light" id="piattoNome" required>
					</div>
					<div class="row mb-3">
						<div class="col-6">
							<label class="form-label small fw-bold text-muted">Tipologia</label>
							<input type="text" class="form-control bg-light" id="piattoTipologia" required>
						</div>
						<div class="col-6">
							<label class="form-label small fw-bold text-muted">Prezzo (€)</label>
							<input type="number" class="form-control bg-light" id="piattoPrezzo" step="0.01" min="0"
							       required>
						</div>
					</div>
					<div class="mb-3">
						<label class="form-label small fw-bold text-muted">Ingredienti (separati da virgola)</label>
						<textarea class="form-control bg-light" id="piattoIngredienti" rows="2" required></textarea>
					</div>
					<div class="mb-3">
						<label class="form-label small fw-bold text-muted">URL Foto</label>
						<input type="url" class="form-control bg-light" id="piattoFoto" required>
					</div>
				</form>
			</div>
			<div class="modal-footer border-0 pt-0">
				<button type="button" class="btn btn-light" data-bs-dismiss="modal">Annulla</button>
				<button type="submit" form="formPiatto" class="btn btn-danger px-4" id="btnSalvaPiatto">Salva</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
	let menuRistorante = [];

	// Controllo autenticazione
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');
	if (!token || ruolo !== 'ristoratore') {
		window.location.replace('auth.html');
	}

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('auth.html');
	}

	// Caricamento dati
	document.addEventListener('DOMContentLoaded', async () => {
		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me', {
				headers: {'Authorization': `Bearer ${token}`}
			});
			const dati = await response.json();

			// Se è nuovo utente, reindirizza alla pagina di creazione ristorante
			if (dati.nuovo) {
				window.location.replace('crea_ristorante.html');
				return;
			}

			document.getElementById('nomeRistoranteNav').textContent = dati.nome;
			menuRistorante = dati.menu || [];
			aggiornaGrigliaMenu();

		} catch (error) {
			alert("Errore di connessione al server.");
		}
	});

	function aggiornaGrigliaMenu() {
		const contenitore = document.getElementById('contenitore-piatti');
		const template = document.getElementById('modello-piatto');
		const messaggioVuoto = document.getElementById('messaggio-vuoto');
		contenitore.innerHTML = '';

		if (menuRistorante.length === 0) {
			messaggioVuoto.classList.remove('d-none');
		} else {
			messaggioVuoto.classList.add('d-none');
		}

		menuRistorante.forEach((piatto, index) => {
			const clone = template.content.cloneNode(true);
			clone.querySelector('.foto-piatto').src = piatto.strMealThumb;
			clone.querySelector('.nome-piatto').textContent = piatto.strMeal;
			clone.querySelector('.tipologia-piatto').textContent = piatto.strCategory;
			let prezzo = piatto.prezzo;
			clone.querySelector('.prezzo-piatto').textContent = `€ ${prezzo.toFixed(2)}`;
			clone.querySelector('.ingredienti-piatto').textContent = piatto.ingredients.join(', ');

			clone.querySelector('.btn-modifica').addEventListener('click', () => apriModalePerModifica(index));
			clone.querySelector('.btn-rimuovi').addEventListener('click', () => {
				menuRistorante.splice(index, 1);
				aggiornaGrigliaMenu();
			});
			contenitore.appendChild(clone);
		});
	}

	// Salva menu nel database
	document.getElementById('btnSalvaMenu').addEventListener('click', async () => {
		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me/menu', {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify(menuRistorante)
			});

			if (response.ok) {
				alert("Menù salvato con successo nel database!");
			} else {
				alert("Errore durante il salvataggio.");
			}
		} catch (error) {
			alert("Errore di connessione al server.");
		}
	});

	async function popolaModaleCatalogo() {
		try {
			const response = await fetch('http://localhost:3000/api/catalogo');
			const catalogoPiatti = await response.json();
			const listaCatalogo = document.getElementById('lista-catalogo');
			const template = document.getElementById('modello-elemento-catalogo');
			listaCatalogo.innerHTML = '';

			catalogoPiatti.forEach(piatto => {
				const clone = template.content.cloneNode(true);
				clone.querySelector('.foto-catalogo').src = piatto.strMealThumb;
				clone.querySelector('.nome-catalogo').textContent = piatto.strMeal;
				clone.querySelector('.tipologia-catalogo').textContent = piatto.strCategory || 'Vario';

				clone.querySelector('.btn-aggiungi-catalogo').addEventListener('click', () => {
					const giaPresente = menuRistorante.find(p => p.idMeal === piatto.idMeal);
					if (!giaPresente) {
						bootstrap.Modal.getInstance(document.getElementById('catalogoModal')).hide();
						document.getElementById('modalPiattoLabel').textContent = "Imposta Prezzo";
						document.getElementById('piattoNome').value = piatto.strMeal;
						document.getElementById('piattoTipologia').value = piatto.strCategory || "Vario";
						document.getElementById('piattoPrezzo').value = '';
						document.getElementById('piattoIngredienti').value = piatto.ingredients ? piatto.ingredients.join(', ') : "";
						document.getElementById('piattoFoto').value = piatto.strMealThumb;
						document.getElementById('piattoIndice').value = "-1";
						document.getElementById('formPiatto').dataset.idMeal = piatto.idMeal;
						bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto')).show();
					} else {
						alert('Piatto già presente nel tuo menù!');
					}
				});
				listaCatalogo.appendChild(clone);
			});
		} catch (error) {
			alert("Errore nel caricamento del catalogo.");
		}
	}

	function apriModalePerNuovo() {
		document.getElementById('modalPiattoLabel').textContent = "Crea un nuovo piatto";
		document.getElementById('formPiatto').reset();
		document.getElementById('piattoIndice').value = "-1";
		delete document.getElementById('formPiatto').dataset.idMeal;
		bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto')).show();
	}

	function apriModalePerModifica(index) {
		const piatto = menuRistorante[index];
		document.getElementById('modalPiattoLabel').textContent = "Modifica Piatto";
		document.getElementById('piattoNome').value = piatto.strMeal;
		document.getElementById('piattoTipologia').value = piatto.strCategory;
		document.getElementById('piattoPrezzo').value = piatto.prezzo || '';
		document.getElementById('piattoIngredienti').value = piatto.ingredients.join(', ');
		document.getElementById('piattoFoto').value = piatto.strMealThumb;
		document.getElementById('piattoIndice').value = index;
		bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto')).show();
	}

	// Salvataggio piatto in js
	document.getElementById('formPiatto').addEventListener('submit', function (event) {
		event.preventDefault();
		const index = parseInt(document.getElementById('piattoIndice').value);
		const datiPiatto = {
			strMeal: document.getElementById('piattoNome').value.trim(),
			strCategory: document.getElementById('piattoTipologia').value.trim(),
			prezzo: parseFloat(document.getElementById('piattoPrezzo').value),
			ingredients: document.getElementById('piattoIngredienti').value.split(',').map(ing => ing.trim()),
			strMealThumb: document.getElementById('piattoFoto').value.trim()
		};

		if (index === -1) {
			if (this.dataset.idMeal) datiPiatto.idMeal = this.dataset.idMeal;
			menuRistorante.push(datiPiatto);
		} else {
			if (menuRistorante[index].idMeal) datiPiatto.idMeal = menuRistorante[index].idMeal;
			menuRistorante[index] = datiPiatto;
		}

		aggiornaGrigliaMenu();
		bootstrap.Modal.getInstance(document.getElementById('modalPiatto')).hide();
	});
</script>
</body>
</html>
