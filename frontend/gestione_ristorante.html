<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestione ristorante</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	<div class="container-fluid">
		<a href="#" class="navbar-brand mb-0 h1">Fast Food - Area Ristoratore</a>
		<div class="dropdown">
			<button class="btn btn-outline-light dropdown-toggle" type="button" id="userMenuButton"
			        data-bs-toggle="dropdown" aria-expanded="false">
				<i class="bi bi-person-circle me-1"></i> Area Ristoratore
			</button>
			<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuButton">
				<li><a class="dropdown-item" href="#">Sito Pubblico</a></li>
				<li><a class="dropdown-item" href="#">Gestione Ordini</a></li>
				<li>
					<hr class="dropdown-divider">
				</li>
				<li><a class="dropdown-item text-danger" href="#">Logout</a></li>
			</ul>
		</div>
	</div>
</nav>

<div class="container mt-5">
	<h2 class="mb-4">Gestione Ristorante</h2>

	<!-- Intestazione schede -->
	<ul class="nav nav-tabs" id="dashboardTabs">
		<li class="nav-item">
			<button class="nav-link active" id="profilo-tab" data-bs-toggle="tab" data-bs-target="#profilo-pane"
			        type="button">Profilo Ristorante
			</button>
		</li>
		<li class="nav-item">
			<button class="nav-link" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu-pane" type="button">
				Gestione Menù
			</button>
		</li>
	</ul>

	<!-- Contenuto schede -->
	<div class="tab-content" id="dashboardTabsContent">

		<!-- Modifica info ristorante -->
		<div class="tab-pane fade show active p-4 border border-top-0 rounded-bottom bg-white" id="profilo-pane">
			<h4 class="mb-3">Informazioni Generali</h4>
			<form id="formProfiloRistorante">
				<div class="row mb-3">
					<div class="col-md-6">
						<label for="nomeRistorante" class="form-label">Nome Ristorante</label>
						<input type="text" class="form-control" id="nomeRistorante" placeholder="Es. Mario's Burger"
						       required>
					</div>
					<div class="col-md-6">
						<label for="partitaIva" class="form-label">Partita IVA</label>
						<input type="text" class="form-control" id="partitaIva" placeholder="11 cifre" required>
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label for="telefono" class="form-label">Numero di Telefono</label>
						<input type="tel" class="form-control" id="telefono" placeholder="Es. 02 1234567" required>
					</div>
					<div class="col-md-6">
						<label for="emailRistorante" class="form-label">Email Contatto</label>
						<input type="email" class="form-control" id="emailRistorante" placeholder="info@mariosburger.it"
						       required>
					</div>
				</div>

				<div class="mb-4">
					<label for="indirizzoRistorante" class="form-label">Indirizzo</label>
					<input type="text" class="form-control" id="indirizzoRistorante" placeholder="Via Roma 1, Milano"
					       required>
				</div>

				<div class="d-flex justify-content-between">
					<button type="submit" class="btn btn-primary">Salva Modifiche</button>
				</div>
			</form>
		</div>

		<!-- Modifica menù -->
		<div class="tab-pane fade p-4 border border-top-0 rounded-bottom bg-white" id="menu-pane">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h4 class="m-0">I tuoi piatti</h4>
				<div>
					<button type="button" class="btn btn-outline-primary" onclick="apriModalePerNuovo()">
						<i class="bi bi-plus-lg"></i> Crea Piatto Personalizzato
					</button>
					<button type="button" class="btn btn-primary" data-bs-toggle="modal"
					        data-bs-target="#catalogoModal" onclick="popolaModaleCatalogo()">
						<i class="bi bi-journal-plus"></i> Aggiungi da Catalogo
					</button>
				</div>
			</div>

			<!--Messaggio menù vuoto-->
			<div class="d-flex justify-content-between align-items-center mb-4">
			</div>
			<div id="messaggio-vuoto" class="text-center text-muted my-5 d-none">
				<i class="bi bi-journal-x" style="font-size: 3rem;"></i>
				<p class="mt-2">Il tuo menù è vuoto. Inizia ad aggiungere dei piatti!</p>
			</div>

			<!-- Griglia dei piatti nel menù -->
			<div class="row" id="contenitore-piatti">
				<!-- I piatti verranno inseriti qui dinamicamente -->
			</div>
			<div class="mt-4 pt-3 border-top d-flex justify-content-end">
				<button type="button" class="btn btn-success btn-lg shadow-sm" id="btnSalvaMenu">
					<i class="bi bi-cloud-arrow-up"></i> Salva Menù
				</button>
			</div>
		</div>

		<!-- Template per la card del piatto -->
		<template id="modello-piatto">
			<div class="col-md-4 mb-4">
				<div class="card h-100 shadow-sm">
					<img src="" class="card-img-top foto-piatto" alt="Foto piatto"
					     style="height: 200px; object-fit: cover;">
					<div class="card-body d-flex flex-column">
						<div class="d-flex justify-content-between align-items-start mb-2">
							<h5 class="card-title nome-piatto mb-0"></h5>
							<span class="badge bg-secondary tipologia-piatto"></span>
						</div>
						<h6 class="text-success fw-bold prezzo-piatto"></h6>
						<p class="card-text ingredienti-piatto small text-muted flex-grow-1"></p>
						<div class="d-flex justify-content-end mt-2">
							<button class="btn btn-sm btn-outline-primary me-2 btn-modifica"><i
									class="bi bi-pencil"></i> Modifica
							</button>
							<button class="btn btn-sm btn-outline-danger btn-rimuovi"><i class="bi bi-trash"></i>
								Rimuovi
							</button>
						</div>
					</div>
				</div>
			</div>
		</template>

	</div>
</div>

<!--Modale scelta piatto da catalogo-->
<div class="modal fade" id="catalogoModal" tabindex="-1" aria-labelledby="catalogoModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-scrollable">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="catalogoModalLabel">Seleziona dal Catalogo</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div class="list-group" id="lista-catalogo">
				</div>

				<!-- Template per elemento del catalogo -->
				<template id="modello-elemento-catalogo">
					<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
						<div class="d-flex align-items-center">
							<img src="" alt="" class="rounded me-3 foto-catalogo"
							     style="width: 50px; height: 50px; object-fit: cover;">
							<div>
								<h6 class="mb-0 nome-catalogo"></h6>
								<small class="text-muted tipologia-catalogo"></small>
							</div>
						</div>
						<button class="btn btn-sm btn-outline-success btn-aggiungi-catalogo">
							<i class="bi bi-plus-lg"></i> Aggiungi
						</button>
					</div>
				</template>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
			</div>
		</div>
	</div>
</div>

<!-- Modale crea piatto personalizzato o modifica piatto nel menù -->
<div class="modal fade" id="modalPiatto" tabindex="-1" aria-labelledby="modalPiattoLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalPiattoLabel">Gestione Piatto</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="formPiatto">
					<input type="hidden" id="piattoIndice" value="-1">

					<div class="mb-3">
						<label for="piattoNome" class="form-label">Nome Piatto</label>
						<input type="text" class="form-control" id="piattoNome" required>
					</div>
					<div class="row mb-3">
						<div class="col-md-6">
							<label for="piattoTipologia" class="form-label">Tipologia</label>
							<input type="text" class="form-control" id="piattoTipologia"
							       placeholder="Es. Panino, Dessert..." required>
						</div>
						<div class="col-md-6">
							<label for="piattoPrezzo" class="form-label">Prezzo (€)</label>
							<input type="number" class="form-control" id="piattoPrezzo" step="0.01" min="0" required>
						</div>
					</div>
					<div class="mb-3">
						<label for="piattoIngredienti" class="form-label">Ingredienti (separati da virgola)</label>
						<textarea class="form-control" id="piattoIngredienti" rows="3" required></textarea>
					</div>
					<div class="mb-3">
						<label for="piattoIstruzioni" class="form-label">Ricetta (Opzionale)</label>
						<textarea class="form-control" id="piattoIstruzioni" rows="4"
						          placeholder="Passaggi per la preparazione..."></textarea>
					</div>
					<div class="mb-3">
						<label for="piattoFoto" class="form-label">URL Foto</label>
						<input type="url" class="form-control" id="piattoFoto" required>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
				<button type="submit" form="formPiatto" class="btn btn-primary" id="btnSalvaPiatto">Salva</button>
			</div>
		</div>
	</div>
</div>

<script>
	let menuRistorante = [];

	// Aggiornamento dati ristorante
	document.getElementById('formProfiloRistorante').addEventListener('submit', async function (event) {
		event.preventDefault();

		const datiAggiornati = {
			nome: document.getElementById('nomeRistorante').value,
			partitaIva: document.getElementById('partitaIva').value,
			telefono: document.getElementById('telefono').value,
			email: document.getElementById('emailRistorante').value,
			indirizzo: document.getElementById('indirizzoRistorante').value
		};

		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me', {
				method: 'PUT',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(datiAggiornati)
			});

			const risultato = await response.json();

			if (response.ok) {
				alert("Profilo aggiornato con successo!");
			} else {
				alert("Errore: " + risultato.message + "\n" + (risultato.dettagli || ""));
			}
		} catch (error) {
			alert("Errore di connessione al server.");
		}
	});

	// all'avvio carica tutti i dati
	document.addEventListener('DOMContentLoaded', async () => {
		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me');
			const ristorante = await response.json();

			if (!response.ok) {
				alert("Errore nel caricamento dei dati del ristorante: " + ristorante.message);
				return;
			}

			document.getElementById('nomeRistorante').value = ristorante.nome;
			document.getElementById('partitaIva').value = ristorante.partitaIva;
			document.getElementById('telefono').value = ristorante.telefono;
			document.getElementById('emailRistorante').value = ristorante.email;
			document.getElementById('indirizzoRistorante').value = ristorante.indirizzo;

			menuRistorante = ristorante.menu;
			aggiornaGrigliaMenu();

		} catch (error) {
			console.error("Errore:", error);
		}
	});

	// Funzione per stampare i piatti del menu
	function aggiornaGrigliaMenu() {
		const contenitore = document.getElementById('contenitore-piatti');
		const template = document.getElementById('modello-piatto');
		const messaggioVuoto = document.getElementById('messaggio-vuoto');
		contenitore.innerHTML = '';

		// Mostra messaggio se il menù è vuoto
		if (menuRistorante.length === 0) {
			messaggioVuoto.classList.remove('d-none');
		} else {
			messaggioVuoto.classList.add('d-none');
		}

		menuRistorante.forEach((piatto, index) => {
			const clone = template.content.cloneNode(true);
			clone.querySelector('.foto-piatto').src = piatto.strMealThumb;
			clone.querySelector('.nome-piatto').textContent = piatto.strMeal;
			clone.querySelector('.tipologia-piatto').textContent = piatto.strCategory;

			// Prezzo. Se non presente, usiamo 5.00€ di default
			let prezzo = piatto.prezzo || 5.00;
			clone.querySelector('.prezzo-piatto').textContent = `€ ${prezzo.toFixed(2)}`;

			// trasformiamo ingredienti in stringa
			clone.querySelector('.ingredienti-piatto').textContent = piatto.ingredients.join(', ');

			// Tasto Modifica
			clone.querySelector('.btn-modifica').addEventListener('click', () => {
				apriModalePerModifica(index);
			});

			// Tasto Rimuovi
			clone.querySelector('.btn-rimuovi').addEventListener('click', () => {
				menuRistorante.splice(index, 1);
				aggiornaGrigliaMenu();
			});

			contenitore.appendChild(clone);
		});
	}

	aggiornaGrigliaMenu();

	// Salvataggio del menù nel db
	document.getElementById('btnSalvaMenu').addEventListener('click', async () => {
		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me/menu', {
				method: 'PUT',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(menuRistorante)
			});

			const risultato = await response.json();

			if (response.ok) {
				alert("Menù salvato correttamente nel database!");
			} else {
				alert("Errore nel salvataggio: " + risultato.message + "\n" + (risultato.dettagli || ""));
			}
		} catch (error) {
			alert("Errore di connessione al server durante il salvataggio del menù.");
		}
	});

	// Popolamento catalogo con i piatti
	async function popolaModaleCatalogo() {
		try {
			// Scarichiamo i dati dall'API
			const response = await fetch('http://localhost:3000/api/catalogo');
			if (!response.ok) {
				alert("Errore nel caricamento del catalogo dal server.");
				return;
			}
			const catalogoPiatti = await response.json(); // Ecco l'array vero!

			const listaCatalogo = document.getElementById('lista-catalogo');
			const template = document.getElementById('modello-elemento-catalogo');
			listaCatalogo.innerHTML = '';

			catalogoPiatti.forEach(piatto => {
				const clone = template.content.cloneNode(true);
				const img = clone.querySelector('.foto-catalogo');
				img.src = piatto.strMealThumb;
				img.alt = piatto.strMeal;

				clone.querySelector('.nome-catalogo').textContent = piatto.strMeal;
				clone.querySelector('.tipologia-catalogo').textContent = piatto.strCategory;

				// Aggiunta piatto al menù
				clone.querySelector('.btn-aggiungi-catalogo').addEventListener('click', () => {
					const giaPresente = menuRistorante.find(p => p.idMeal === piatto.idMeal);
					if (!giaPresente) {
						bootstrap.Modal.getInstance(document.getElementById('catalogoModal')).hide();

						document.getElementById('modalPiattoLabel').textContent = "Conferma Piatto e Imposta Prezzo";
						document.getElementById('btnSalvaPiatto').textContent = "Aggiungi al Menù";

						document.getElementById('piattoNome').value = piatto.strMeal;
						document.getElementById('piattoTipologia').value = piatto.strCategory || "Vario";
						document.getElementById('piattoPrezzo').value = '';
						document.getElementById('piattoIngredienti').value = piatto.ingredients ? piatto.ingredients.join(', ') : "";
						document.getElementById('piattoFoto').value = piatto.strMealThumb;
						document.getElementById('piattoIstruzioni').value = piatto.strInstructions || "";

						document.getElementById('piattoIndice').value = "-1";
						document.getElementById('formPiatto').dataset.idMeal = piatto.idMeal;

						bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto')).show();
					} else {
						alert('Piatto già presente nel tuo menù!');
					}
				});
				listaCatalogo.appendChild(clone);
			});

		} catch (error) {
			console.error("Errore di connessione al catalogo:", error);
		}
	}

	// Apre la modale vuota per creare un nuovo piatto personalizzato
	function apriModalePerNuovo() {
		document.getElementById('modalPiattoLabel').textContent = "Crea un nuovo piatto";
		document.getElementById('btnSalvaPiatto').textContent = "Salva Piatto";
		document.getElementById('formPiatto').reset(); // Svuota i campi
		document.getElementById('piattoIndice').value = "-1"; // -1 => nuovo piatto

		delete document.getElementById('formPiatto').dataset.idMeal;

		const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto'));
		modal.show();
	}

	// Apre la modale pre-compilata per modificare un piatto
	function apriModalePerModifica(index) {
		const piatto = menuRistorante[index];

		document.getElementById('modalPiattoLabel').textContent = "Modifica Piatto";
		document.getElementById('btnSalvaPiatto').textContent = "Applica Modifiche";

		// Pre-compiliamo i campi con i dati attuali
		document.getElementById('piattoNome').value = piatto.strMeal;
		document.getElementById('piattoTipologia').value = piatto.strCategory;
		document.getElementById('piattoPrezzo').value = piatto.prezzo || '';
		document.getElementById('piattoIngredienti').value = piatto.ingredients.join(', ');
		document.getElementById('piattoFoto').value = piatto.strMealThumb;
		document.getElementById('piattoIstruzioni').value = piatto.strInstructions || "";

		document.getElementById('piattoIndice').value = index; // Salviamo l'indice del piatto da modificare

		const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPiatto'));
		modal.show();
	}

	// Gestione submit del form per creare/modificare piatto
	document.getElementById('formPiatto').addEventListener('submit', function (event) {
		event.preventDefault();

		const index = parseInt(document.getElementById('piattoIndice').value);

		const datiPiatto = {
			strMeal: document.getElementById('piattoNome').value.trim(),
			strCategory: document.getElementById('piattoTipologia').value.trim(),
			prezzo: parseFloat(document.getElementById('piattoPrezzo').value),
			ingredients: document.getElementById('piattoIngredienti').value.split(',').map(ing => ing.trim()),
			strMealThumb: document.getElementById('piattoFoto').value.trim(),
			strInstructions: document.getElementById('piattoIstruzioni').value.trim()
		};

		//se è un nuovo piatto, lo aggiungiamo, altrimenti aggiorniamo quello esistente.
		if (index === -1) {
			if (this.dataset.idMeal) {
				datiPiatto.idMeal = this.dataset.idMeal;
				delete this.dataset.idMeal;
			}
			menuRistorante.push(datiPiatto);
		} else {
			if (menuRistorante[index].idMeal) datiPiatto.idMeal = menuRistorante[index].idMeal;
			menuRistorante[index] = datiPiatto;
		}

		aggiornaGrigliaMenu();
		bootstrap.Modal.getInstance(document.getElementById('modalPiatto')).hide();
	});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
