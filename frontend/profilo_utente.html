<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Il mio Profilo - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="ms-auto d-flex align-items-center mt-2 mt-lg-0">

				<div id="nav-guest" class="d-flex w-100">
					<a href="auth.html" class="btn btn-light text-danger fw-bold w-100 shadow-sm">Accedi / Registrati</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2 w-100">
					<a href="homepage.html" class="btn btn-outline-light btn-sm d-flex align-items-center"><i class="bi bi-house me-1"></i> Home</a>

					<div class="dropdown flex-grow-1">
						<button class="btn btn-outline-light btn-sm dropdown-toggle w-100 d-flex align-items-center justify-content-center" type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="nav-menu-dropdown">
							</ul>
					</div>

					<button class="btn btn-light text-danger btn-sm fw-bold shadow-sm" onclick="esci()"><i class="bi bi-box-arrow-right d-lg-none"></i><span class="d-none d-lg-inline"> Esci</span></button>
				</div>

			</div>
		</div>
	</div>
</nav>

<div class="container my-5">
	<div class="row justify-content-center">
		<div class="col-12 col-md-10 col-lg-8">

			<div class="card shadow-sm border-0 rounded-4 overflow-hidden mb-4">
				<div class="card-header bg-white p-4 border-bottom">
					<h4 class="mb-0 fw-bold"><i class="bi bi-person-circle text-danger me-2"></i> I tuoi Dati Personali
					</h4>
				</div>

				<div class="card-body p-4 p-md-5">
					<div id="alertBox" class="alert d-none text-center" role="alert"></div>

					<form id="formProfilo">
						<div class="row g-3 mb-4">
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="profiloNome">Nome</label>
								<input type="text" class="form-control bg-light" id="profiloNome" required>
							</div>
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="profiloCognome">Cognome</label>
								<input type="text" class="form-control bg-light" id="profiloCognome" required>
							</div>
							<div class="col-12">
								<label class="form-label fw-semibold" for="profiloEmail">Email</label>
								<input type="email" class="form-control bg-light" id="profiloEmail" required>
							</div>
							<div class="col-12 border-top pt-3 mt-4">
								<label class="form-label fw-semibold" for="profiloPassword">Nuova Password</label>
								<input type="password" class="form-control bg-light" id="profiloPassword"
								       placeholder="Nuova Password">
								<small class="text-muted">Minimo 6 caratteri</small>
							</div>
						</div>

						<div id="sezionePreferenze" class="bg-danger-subtle p-4 rounded-3 mb-4">
							<h6 class="fw-bold mb-3"><i class="bi bi-star-fill text-danger me-2"></i> Le tue Preferenze
							</h6>

							<label class="form-label small fw-semibold" for="profiloPagamento">Metodo di Pagamento Predefinito</label>
							<select class="form-select form-select-sm bg-white mb-3" id="profiloPagamento">
								<option value="nessuno">---</option>
								<option value="carta_di_credito">Carta di Credito</option>
								<option value="carta_prepagata">Carta Prepagata</option>
								<option value="alla_consegna">Contanti alla Consegna</option>
							</select>

							<label class="form-label small fw-semibold mb-1">I tuoi cibi preferiti</label><br>
							<label class="form-label small mb-1">Cosa ti piace mangiare?</label><br>
							<div id="contenitoreCategorie" class="mb-3">
								<span class="spinner-border spinner-border-sm text-danger" role="status"></span>
								<small class="text-muted"> Caricamento categorie...</small>
							</div>
						</div>

						<button type="submit" class="btn btn-danger w-100 py-3 fw-bold shadow-sm">
							<i class="bi bi-save me-2"></i> Salva Modifiche
						</button>
					</form>
				</div>
			</div>

			<div class="card shadow-sm border-danger border-opacity-50 rounded-4 overflow-hidden">
				<div class="card-body p-4 text-center bg-white">
					<h5 class="fw-bold text-danger mb-2">Elimina Account</h5>
					<p class="text-muted small mb-3">Se elimini il tuo account, perderai tutte le informazioni. L'azione
						è irreversibile.</p>
					<button class="btn btn-outline-danger" onclick="eliminaAccount()">
						<i class="bi bi-trash-fill me-1"></i> Elimina Account Definitivamente
					</button>
				</div>
			</div>

		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');

	if (!token) {
		window.location.replace('auth.html');
	}

	document.addEventListener('DOMContentLoaded', () => {
		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const menuDropdown = document.getElementById('nav-menu-dropdown');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
					<li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-bag-check me-2"></i> I miei Ordini</a></li>
				`;
			} else if (ruolo === 'ristoratore') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Gestione Menù</a></li>
					<li><a class="dropdown-item" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Ordini Ricevuti</a></li>
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Personale</a></li>
					<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni Locale</a></li>
				`;
			}
		}
	});

	if (ruolo === 'ristoratore') {
		document.getElementById('sezionePreferenze').classList.add('d-none');
	}

	function mostraMessaggio(messaggio, tipo) {
		const alertBox = document.getElementById('alertBox');
		alertBox.className = `alert alert-${tipo} text-center`;
		alertBox.textContent = messaggio;
		alertBox.classList.remove('d-none');
		window.scrollTo({top: 0, behavior: 'smooth'});
	}

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('auth.html');
	}

	// Carica categorie dinamicamente
	async function caricaCategorie() {
		try {
			const response = await fetch('http://localhost:3000/api/catalogo/categorie');
			const categorie = await response.json();
			const contenitore = document.getElementById('contenitoreCategorie');
			contenitore.innerHTML = '';

			let html = '';
			const maxVisibili = 4;

			categorie.forEach((cat, index) => {
				const checkboxHtml = `
				<div class="form-check form-check-inline">
					<input class="form-check-input preferenza-check" type="checkbox" value="${cat}" id="cat_${index}">
					<label class="form-check-label small" for="cat_${index}">${cat}</label>
				</div>`;

				if (index === maxVisibili) {
					html += `<div class="collapse mt-2" id="altrePreferenze">`;
				}
				html += checkboxHtml;
			});

			if (categorie.length > maxVisibili) {
				html += `</div>`;
				html += `
				<div class="mt-2">
					<a class="text-danger small fw-bold text-decoration-none" data-bs-toggle="collapse" href="#altrePreferenze" role="button" aria-expanded="false" aria-controls="altrePreferenze" onclick="this.innerText = this.innerText.includes('Mostra') ? 'Nascondi categorie ▲' : 'Mostra altre categorie ▼'">
						Mostra altre categorie ▼
					</a>
				</div>`;
			}
			contenitore.innerHTML = html;
		} catch (error) {
			document.getElementById('contenitoreCategorie').innerHTML = '<small class="text-danger">Errore nel caricamento categorie.</small>';
		}
	}

	// carica dati form
	document.addEventListener('DOMContentLoaded', async () => {
		await caricaCategorie();
		try {
			const response = await fetch('http://localhost:3000/api/utenti/me', {
				headers: {'Authorization': `Bearer ${token}`}
			});
			const utente = await response.json();

			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
			}

			document.getElementById('profiloNome').value = utente.nome;
			document.getElementById('profiloCognome').value = utente.cognome;
			document.getElementById('profiloEmail').value = utente.email;

			if (utente.metodoPagamento) {
				document.getElementById('profiloPagamento').value = utente.metodoPagamento;
			}
			if (utente.preferenze && utente.preferenze.length > 0) {
				document.querySelectorAll('.preferenza-check').forEach(checkbox => {
					if (utente.preferenze.includes(checkbox.value)) {
						checkbox.checked = true;
					}
				});
			}

		} catch (error) {
			console.error(error);
			mostraMessaggio("Errore nel caricamento dei dati.", "danger");
		}
	});

	// aggiorna dati
	document.getElementById('formProfilo').addEventListener('submit', async function (event) {
		event.preventDefault();

		const preferenzeSelezionate = Array.from(document.querySelectorAll('.preferenza-check:checked')).map(cb => cb.value);
		const passwordInput = document.getElementById('profiloPassword').value;

		const datiAggiornati = {
			nome: document.getElementById('profiloNome').value.trim(),
			cognome: document.getElementById('profiloCognome').value.trim(),
			email: document.getElementById('profiloEmail').value.trim(),
			metodoPagamento: document.getElementById('profiloPagamento').value,
			preferenze: preferenzeSelezionate
		};

		if (passwordInput.trim() !== "") {
			datiAggiornati.password = passwordInput;
		}

		try {
			const response = await fetch('http://localhost:3000/api/utenti/me', {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify(datiAggiornati)
			});

			const risultato = await response.json();

			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
				mostraMessaggio(risultato.message || "Impossibile caricare i dati", "danger");
				return;
			}

			mostraMessaggio("Profilo aggiornato con successo!", "success");
			document.getElementById('profiloPassword').value = "";

		} catch (error) {
			mostraMessaggio("Errore di connessione al server.", "danger");
		}
	});

	// elimina account
	async function eliminaAccount() {
		const conferma = confirm("Sei davvero sicuro di voler eliminare il tuo account? Questa operazione NON può essere annullata.");

		if (conferma) {
			try {
				const response = await fetch('http://localhost:3000/api/utenti/me', {
					method: 'DELETE',
					headers: {'Authorization': `Bearer ${token}`}
				});

				if (response.ok) {
					alert("Account eliminato con successo.");
					esci();
				} else {
					const errorData = await response.json();
					mostraMessaggio(errorData.message || "Impossibile eliminare l'account.", "danger");
				}
			} catch (error) {
				mostraMessaggio("Errore di connessione al server.", "danger");
			}
		}
	}
</script>
</body>
</html>
