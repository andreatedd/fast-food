<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dettaglio Ristorante - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="ms-auto d-flex align-items-center mt-2 mt-lg-0">

				<div id="nav-guest" class="d-flex w-100">
					<a href="auth.html" class="btn btn-light text-danger fw-bold w-100 shadow-sm">Accedi /
						Registrati</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2 w-100">
					<a href="homepage.html" class="btn btn-outline-light btn-sm d-flex align-items-center"><i
							class="bi bi-house me-1"></i> Home</a>

					<div class="dropdown flex-grow-1">
						<button class="btn btn-outline-light btn-sm dropdown-toggle w-100 d-flex align-items-center justify-content-center"
						        type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="nav-menu-dropdown">
						</ul>
					</div>

					<button class="btn btn-light text-danger btn-sm fw-bold shadow-sm" onclick="esci()"><i
							class="bi bi-box-arrow-right d-lg-none"></i><span class="d-none d-lg-inline"> Esci</span>
					</button>
				</div>

			</div>
		</div>
	</div>
</nav>

<!--Contatti-->
<div class="bg-white py-4 shadow-sm mb-4 border-bottom">
	<div class="container text-center">
		<h1 class="fw-bold text-danger" id="titoloRistorante">Caricamento...</h1>
		<p class="text-muted mb-0"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span
				id="indirizzoRistorante"></span>
		</p>
		<p class="text-muted"><i class="bi bi-telephone-fill text-success me-1"></i> <span
				id="telefonoRistorante"></span>
		</p>
	</div>
</div>

<!--menu-->
<div class="container mb-5 pb-5">
	<div class="row justify-content-center mb-5">
		<div class="col-md-10">
			<div class="card border-0 shadow-sm rounded-4">
				<div class="card-body p-4">
					<h5 class="card-title mb-3 fw-bold"><i class="bi bi-search text-danger me-2"></i> Cerca nel Menù
					</h5>
					<form id="formRicercaPiatti" class="row g-2">
						<div class="col-md-4">
							<select class="form-select bg-light border-0" id="tipoRicerca"
							        aria-label="Categoria di ricerca">
								<option value="nome">Nome del Piatto</option>
								<option value="tipologia">Tipologia (es. Dessert)</option>
								<option value="ingrediente">Ingrediente</option>
								<option value="prezzo">Prezzo Massimo (€)</option>
							</select>
						</div>
						<div class="col-md-6">
							<input type="text" class="form-control bg-light border-0" id="testoRicerca"
							       aria-label="Testo ricerca" placeholder="Scrivi qui..." required>
						</div>
						<div class="col-md-2">
							<button type="submit" class="btn btn-danger w-100 fw-bold">Filtra</button>
						</div>
					</form>
					<div class="mt-2 text-end">
						<button class="btn btn-sm btn-link text-secondary text-decoration-none" id="btnResetRicerca">
							Mostra tutti i piatti
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="nessun-piatto" class="alert alert-warning d-none text-center rounded-4 border-0 shadow-sm">
		<i class="bi bi-emoji-frown fs-4 d-block mb-2"></i>
		Nessun piatto trovato con questi criteri di ricerca.
	</div>

	<div id="errore" class="alert alert-danger d-none text-center shadow-sm rounded-4 border-0" role="alert">
		<i class="bi bi-exclamation-triangle-fill fs-4 d-block mb-2"></i>
		<strong>Ops! Si è verificato un problema:</strong><br>
		<span id="testo-errore"></span></div>

	<div class="row g-4" id="griglia-menu"></div>
</div>

<!--bottone carrello-->
<div class="position-fixed bottom-0 end-0 p-4 z-3 d-none" id="floatingCartBtnContainer">
	<button class="btn btn-success btn-lg shadow-lg fw-bold rounded-pill px-4" type="button" data-bs-toggle="offcanvas"
	        data-bs-target="#offcanvasCarrello">
		<i class="bi bi-cart3 me-2"></i> Carrello (<span id="cartCount">0</span>) - € <span id="cartTotal">0.00</span>
	</button>
</div>

<!--dettagli carrello e acquisto-->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrello">
	<div class="offcanvas-header bg-danger text-white border-0">
		<h5 class="offcanvas-title fw-bold"><i class="bi bi-cart-fill me-2"></i> Il tuo Ordine</h5>
		<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
	</div>
	<div class="offcanvas-body d-flex flex-column bg-light">
		<div id="cartAlert" class="alert alert-danger d-none text-center small" role="alert"></div>

		<div id="carrello-vuoto" class="text-center text-muted mt-5 d-none">
			<i class="bi bi-cart-x fs-1 opacity-50"></i>
			<p class="mt-2">Il tuo carrello è vuoto</p>
		</div>

		<div id="cartItemsContainer" class="flex-grow-1 overflow-auto pe-2"></div>

		<template id="modello-riga-carrello">
			<div class="d-flex justify-content-between align-items-center bg-white p-3 mb-2 rounded-3 shadow-sm border">
				<div>
					<h6 class="mb-0 fw-bold nome-item"></h6>
					<small class="text-muted info-item"></small>
				</div>
				<button class="btn btn-sm btn-outline-danger border-0 btn-elimina">
					<i class="bi bi-trash"></i>
				</button>
			</div>
		</template>

		<div class="border-top border-2 border-danger-subtle pt-3 mt-3 bg-white p-3 rounded-4 shadow-sm">

			<div class="mb-3 pb-3 border-bottom">
				<label class="form-label small fw-bold text-muted mb-1" for="metodoPagamentoCheckout"><i
						class="bi bi-wallet2 me-1"></i> Metodo di Pagamento</label>
				<select class="form-select form-select-sm bg-light border-0" id="metodoPagamentoCheckout">
					<option value="carta_di_credito">Carta di Credito</option>
					<option value="carta_prepagata">Carta Prepagata</option>
					<option value="alla_consegna">Contanti alla Consegna</option>
				</select>
			</div>
			<div class="d-flex justify-content-between fw-bold fs-5 mb-3">
				<span>Totale da pagare:</span>
				<span class="text-success">€ <span id="offcanvasTotal">0.00</span></span>
			</div>
			<button id="btnConfermaOrdine" class="btn btn-danger w-100 py-2 fw-bold">
			    <span id="btnConfermaTestoNormale">
			        <i class="bi bi-credit-card-fill me-2"></i> Conferma e Paga
			    </span>

				<span id="btnConfermaTestoLoading" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Elaborazione...
                </span>
			</button>
		</div>
	</div>
</div>

<template id="modello-card-piatto">
	<div class="col-md-4 col-lg-3">
		<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
			<img src="" class="card-img-top object-fit-cover foto-piatto" alt="..." style="height: 200px;">
			<div class="card-body d-flex flex-column p-4">
				<div class="d-flex justify-content-between align-items-start mb-2">
					<h5 class="card-title fw-bold nome-piatto mb-0"></h5>
					<span class="badge bg-danger tipologia-piatto rounded-pill"></span>
				</div>
				<h5 class="text-success fw-bold mb-3 prezzo-piatto"></h5>
				<p class="card-text small text-muted ingredienti-piatto mb-3 flex-grow-1"></p>

				<div class="d-flex justify-content-between mt-auto gap-2 border-top pt-3">
					<button class="btn btn-outline-secondary btn-sm flex-grow-1 btn-ricetta d-none fw-bold rounded-pill">
						<i class="bi bi-book"></i> Ricetta
					</button>
					<button class="btn btn-danger btn-sm flex-grow-1 btn-carrello fw-bold rounded-pill shadow-sm">
						<i class="bi bi-cart-plus"></i> Aggiungi
					</button>
				</div>
			</div>
		</div>
	</div>
</template>

<div class="modal fade" id="ricettaModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
		<div class="modal-content rounded-4 border-0">
			<div class="modal-header bg-danger text-white border-0">
				<h5 class="modal-title fw-bold" id="titoloRicettaModal">Ricetta</h5>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body p-4">
				<p id="testoRicercaModal" class="lh-lg" style="white-space: pre-wrap;"></p>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	let idRistoranteCorrente = null;
	let carrello = [];

	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');

	document.addEventListener('DOMContentLoaded', async () => {
		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const menuDropdown = document.getElementById('nav-menu-dropdown');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
					<li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-bag-check me-2"></i> I miei Ordini</a></li>
				`;
				// recupero preferenza pagamento
				try {
					const response = await fetch('http://localhost:3000/api/utenti/me', {
						headers: {'Authorization': `Bearer ${token}`}
					});
					if (!response.ok) {
						if (response.status === 401) {
							alert("Sessione scaduta. Effettua nuovamente l'accesso.");
							esci();
							return;
						}
						const errorData = await response.json().catch(() => ({}));
						console.warn(`Avviso: Impossibile preimpostare il pagamento. Errore: ${errorData.message || response.statusText}`);
						return;
					}

					const utente = await response.json();
					if (utente.metodoPagamento && utente.metodoPagamento !== 'nessuno') {
						document.getElementById('metodoPagamentoCheckout').value = utente.metodoPagamento;
					}

				} catch (error) {
					console.error("Errore: Impossibile connettersi al server.", error);
				}
			}

		} else if (ruolo === 'ristoratore') {
			menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Gestione Menù</a></li>
					<li><a class="dropdown-item" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Ordini Ricevuti</a></li>
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Personale</a></li>
					<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni Locale</a></li>
				`;
		}
	});

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('homepage.html');
	}

	function mostraErrore(messaggio) {
		const griglia = document.getElementById('griglia-menu');
		const alertErrore = document.getElementById('errore');
		const testoErrore = document.getElementById('testo-errore');

		griglia.classList.add('d-none');
		testoErrore.textContent = messaggio;
		alertErrore.classList.remove('d-none');
	}

	async function caricaDettaglioRistorante() {
		const urlParams = new URLSearchParams(window.location.search);
		idRistoranteCorrente = urlParams.get('id');

		if (!idRistoranteCorrente) {
			alert("ID Ristorante mancante nell'URL!");
			window.location.replace('homepage.html');
			return;
		}

		try {
			const response = await fetch(`http://localhost:3000/api/ristoranti/${idRistoranteCorrente}`);

			if (!response.ok) {
				alert("Ristorante non trovato.");
				window.location.replace('homepage.html');
				return;
			}

			const ristorante = await response.json();

			document.getElementById('titoloRistorante').textContent = ristorante.nome;
			document.getElementById('indirizzoRistorante').textContent = ristorante.indirizzo;
			document.getElementById('telefonoRistorante').textContent = ristorante.telefono;

			await caricaPiatti();
		} catch (error) {
			console.error("Errore:", error);
			document.getElementById('titoloRistorante').textContent = "Errore di connessione";
			mostraErrore("Impossibile connettersi al server.");
		}
	}

	async function caricaPiatti(tipo = "", testo = "") {
		let url = `http://localhost:3000/api/ristoranti/${idRistoranteCorrente}/piatti`;

		if (tipo && testo) {
			url += `?tipo=${tipo}&testo=${encodeURIComponent(testo)}`;
		}

		try {
			const response = await fetch(url);
			if (!response.ok) {
				const errorData = await response.json().catch(() => ({}));
				mostraErrore(errorData.message || "Impossibile caricare i piatti.");
				return;
			}
			const piatti = await response.json();
			mostraMenu(piatti);
		} catch (error) {
			console.error("Errore:", error);
			mostraErrore("Errore di connessione al server.");
		}
	}

	function mostraMenu(piattiDaMostrare) {
		const griglia = document.getElementById('griglia-menu');
		const template = document.getElementById('modello-card-piatto');
		const alertNessunPiatto = document.getElementById('nessun-piatto');
		const alertErrore = document.getElementById('errore');

		griglia.innerHTML = '';
		alertErrore.classList.add('d-none');
		griglia.classList.remove('d-none');

		if (piattiDaMostrare.length === 0) {
			alertNessunPiatto.classList.remove('d-none');
			return;
		} else {
			alertNessunPiatto.classList.add('d-none');
		}

		piattiDaMostrare.forEach(piatto => {
			const clone = template.content.cloneNode(true);

			clone.querySelector('.foto-piatto').src = piatto.strMealThumb;
			clone.querySelector('.nome-piatto').textContent = piatto.strMeal;
			clone.querySelector('.tipologia-piatto').textContent = piatto.strCategory;
			clone.querySelector('.prezzo-piatto').textContent = `€ ${piatto.prezzo.toFixed(2)}`;
			clone.querySelector('.ingredienti-piatto').textContent = piatto.ingredients ? piatto.ingredients.join(', ') : "Ingredienti non specificati";

			// ricetta
			if (piatto.strInstructions && piatto.strInstructions.trim() !== "") {
				const btnRicetta = clone.querySelector('.btn-ricetta');
				btnRicetta.classList.remove('d-none');

				btnRicetta.addEventListener('click', () => {
					document.getElementById('titoloRicettaModal').textContent = `Ricetta: ${piatto.strMeal}`;
					document.getElementById('testoRicercaModal').textContent = piatto.strInstructions;
					bootstrap.Modal.getOrCreateInstance(document.getElementById('ricettaModal')).show();
				});
			}

			// aggiunta al carrello
			clone.querySelector('.btn-carrello').addEventListener('click', () => {
				const token = localStorage.getItem('token');
				const ruolo = localStorage.getItem('ruolo');

				if (!token || ruolo !== 'cliente') {
					alert("Devi accedere al tuo account Cliente per poter ordinare!");
					window.location.replace('auth.html');
					return;
				}
				aggiungiAlCarrello(piatto.strMeal, piatto.prezzo);
			});

			griglia.appendChild(clone);
		});
	}

	function aggiungiAlCarrello(nomePiatto, prezzo) {
		const elementoEsistente = carrello.find(item => item.nome === nomePiatto);

		if (elementoEsistente) {
			elementoEsistente.quantita += 1;
		} else {
			carrello.push({nome: nomePiatto, prezzo: prezzo, quantita: 1});
		}

		aggiornaUIcarrello();
	}

	function rimuoviDalCarrello(nomePiatto) {
		carrello = carrello.filter(item => item.nome !== nomePiatto);
		aggiornaUIcarrello();
	}

	function aggiornaUIcarrello() {
		const carrelloBtn = document.getElementById('floatingCartBtnContainer');
		const cartItemsContainer = document.getElementById('cartItemsContainer');
		const carrelloVuoto = document.getElementById('carrello-vuoto');
		const rigaCarrello = document.getElementById('modello-riga-carrello');

		// nasconde alert del carrello
		const alertBox = document.getElementById('cartAlert');
		alertBox.classList.add('d-none');

		let totale = 0;
		let numeroPezzi = 0;
		cartItemsContainer.innerHTML = '';

		if (carrello.length === 0) {
			carrelloBtn.classList.add('d-none');
			carrelloVuoto.classList.remove('d-none');
		} else {
			carrelloBtn.classList.remove('d-none');
			carrelloVuoto.classList.add('d-none');

			carrello.forEach(item => {
				totale += (item.prezzo * item.quantita);
				numeroPezzi += item.quantita;

				const clone = rigaCarrello.content.cloneNode(true);

				clone.querySelector('.nome-item').textContent = item.nome;
				clone.querySelector('.info-item').textContent = `${item.quantita} x € ${item.prezzo.toFixed(2)}`;

				clone.querySelector('.btn-elimina').addEventListener('click', () => {
					rimuoviDalCarrello(item.nome);
				});
				cartItemsContainer.appendChild(clone);
			});
		}

		document.getElementById('cartCount').textContent = numeroPezzi;
		document.getElementById('cartTotal').textContent = totale.toFixed(2);
		document.getElementById('offcanvasTotal').textContent = totale.toFixed(2);
	}

	// Invio ordine al db
	document.getElementById('btnConfermaOrdine').addEventListener('click', async () => {
		const token = localStorage.getItem('token');
		const alertBox = document.getElementById('cartAlert');
		const btn = document.getElementById('btnConfermaOrdine');
		const testoNormale = document.getElementById('btnConfermaTestoNormale');
		const testoLoading = document.getElementById('btnConfermaTestoLoading');

		alertBox.classList.add('d-none');
		// Disabilita il bottone e mostra caricamento
		btn.disabled = true;
		testoNormale.classList.add('d-none');
		testoLoading.classList.remove('d-none');

		const ripristinaBottone = () => {
			btn.disabled = false;
			testoLoading.classList.add('d-none');
			testoNormale.classList.remove('d-none');
		};

		try {
			const response = await fetch('http://localhost:3000/api/ordini', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify({
					ristoranteId: idRistoranteCorrente,
					piatti: carrello
				})
			});

			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
				const errorData = await response.json().catch(() => ({}));
				alertBox.textContent = errorData.message || "Errore durante la conferma dell'ordine.";
				alertBox.classList.remove('d-none');

				ripristinaBottone();
				return;
			}

			const risultato = await response.json();

			carrello = [];
			aggiornaUIcarrello();

			bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasCarrello')).hide();

			alert(`Ordine confermato con successo!\n\nIl ristorante ha ricevuto il tuo ordine.\nTempo di attesa stimato: ${risultato.ordine.tempoAttesaStimato} minuti.`);
			ripristinaBottone();
		} catch (error) {
			console.error("Errore:", error);
			alertBox.textContent = "Errore di connessione al server.";
			alertBox.classList.remove('d-none');

			ripristinaBottone();
		}
	});

	document.getElementById('formRicercaPiatti').addEventListener('submit', async (e) => {
		e.preventDefault();
		const tipoRicerca = document.getElementById('tipoRicerca').value;
		const testoCercato = document.getElementById('testoRicerca').value.trim();
		await caricaPiatti(tipoRicerca, testoCercato);
	});

	document.getElementById('btnResetRicerca').addEventListener('click', async (e) => {
		e.preventDefault();
		document.getElementById('formRicercaPiatti').reset();
		await caricaPiatti();
	});

	document.addEventListener('DOMContentLoaded', caricaDettaglioRistorante);
</script>
</body>
</html>
