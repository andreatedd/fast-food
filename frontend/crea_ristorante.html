<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Impostazioni Ristorante - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="#">
			<i class="bi bi-shop"></i> FastFood App - Area Ristoratore
		</a>
		<button class="btn btn-outline-light btn-me" onclick="esci()"><i
				class="bi bi-box-arrow-right me-2"></i>Esci
		</button>
	</div>
</nav>

<div class="container my-5">
	<div class="row justify-content-center">
		<div class="col-12 col-md-10 col-lg-8">

			<div class="card shadow-lg border-0 rounded-4 overflow-hidden">
				<div class="card-header bg-danger text-white p-4 border-0 text-center">
					<h3 id="formTitolo" class="mb-0 fw-bold">Benvenuto!</h3>
					<p id="formSottotitolo" class="mb-0 opacity-75">Configura il tuo ristorante per iniziare a
						vendere</p>
				</div>

				<div class="card-body p-4 p-md-5">
					<div id="alertBox" class="alert d-none text-center" role="alert"></div>

					<form id="formCreaRistorante">
						<div class="row g-3 mb-4">
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="nomeRistorante">Nome Ristorante</label>
								<input type="text" class="form-control bg-light" id="nomeRistorante"
								       placeholder="Es. Mario's Burger" required>
							</div>
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="partitaIva">Partita IVA</label>
								<input type="text" class="form-control bg-light" id="partitaIva"
								       placeholder="11 cifre numeriche" pattern="[0-9]{11}" required>
							</div>
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="telefono">Telefono</label>
								<input type="tel" class="form-control bg-light" id="telefono"
								       placeholder="Es. 02 1234567" required>
							</div>
							<div class="col-md-6">
								<label class="form-label fw-semibold" for="emailRistorante">Email di Contatto</label>
								<input type="email" class="form-control bg-light" id="emailRistorante"
								       placeholder="info@tuolocale.it" required>
							</div>
							<div class="col-12">
								<label class="form-label fw-semibold" for="indirizzoRistorante">Indirizzo Fisico</label>
								<input type="text" class="form-control bg-light" id="indirizzoRistorante"
								       placeholder="Via Roma 1, Milano" required>
							</div>
						</div>

						<div class="d-flex gap-3 mt-2">
							<a href="dashboard.html" id="btnAnnulla"
							   class="btn btn-outline-secondary w-50 py-3 fw-bold fs-5 d-none">
								<i class="bi bi-arrow-left me-2"></i> Annulla
							</a>

							<button type="submit" id="btnSalva"
							        class="btn btn-danger w-100 py-3 fw-bold fs-5 shadow-sm">
								<i class="bi bi-check-circle me-2"></i> <span id="testoBtnSalva">Salva e vai alla Dashboard</span>
							</button>
						</div>
					</form>
				</div>
			</div>

		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	// Controllo autenticazione
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');
	if (!token || ruolo !== 'ristoratore') {
		window.location.replace('auth.html');
	}

	function mostraMessaggio(messaggio, tipo) {
		const alertBox = document.getElementById('alertBox');
		alertBox.className = `alert alert-${tipo} text-center`;
		alertBox.textContent = messaggio;
		alertBox.classList.remove('d-none');
	}

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('auth.html');
	}

	// Controllo creazione o modifica
	document.addEventListener('DOMContentLoaded', async () => {
		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me', {
				headers: {'Authorization': `Bearer ${token}`}
			});
			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
			}
			const dati = await response.json();

			// Modifica
			if (!dati.nuovo) {
				document.getElementById('formTitolo').textContent = "Impostazioni Locale";
				document.getElementById('formSottotitolo').textContent = "Aggiorna le informazioni del tuo ristorante";

				document.getElementById('nomeRistorante').value = dati.nome;
				document.getElementById('partitaIva').value = dati.partitaIva;
				document.getElementById('telefono').value = dati.telefono;
				document.getElementById('emailRistorante').value = dati.email;
				document.getElementById('indirizzoRistorante').value = dati.indirizzo;

				document.getElementById('btnAnnulla').classList.remove('d-none');
				document.getElementById('btnSalva').classList.remove('w-100');
				document.getElementById('btnSalva').classList.add('w-50');
				document.getElementById('testoBtnSalva').textContent = "Applica Modifiche";
			}
		} catch (error) {
			console.error("Errore: ", error);
			mostraMessaggio("Errore di connessione al server.", "danger");
		}
	});

	// Creazione o aggiornamento ristorante
	document.getElementById('formCreaRistorante').addEventListener('submit', async function (event) {
		event.preventDefault();

		const datiRistorante = {
			nome: document.getElementById('nomeRistorante').value.trim(),
			partitaIva: document.getElementById('partitaIva').value.trim(),
			telefono: document.getElementById('telefono').value.trim(),
			email: document.getElementById('emailRistorante').value.trim(),
			indirizzo: document.getElementById('indirizzoRistorante').value.trim()
		};

		try {
			const response = await fetch('http://localhost:3000/api/ristoratore/me', {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify(datiRistorante)
			});

			const risultato = await response.json();

			if (!response.ok) {
				mostraMessaggio("Errore: " + (risultato.message || "Dati non validi"), "danger");
				return;
			}

			mostraMessaggio("Modifiche salvate con successo! Reindirizzamento...", "success");

			setTimeout(() => {
				window.location.href = 'dashboard.html';
			}, 500);

		} catch (error) {
			mostraMessaggio("Errore di connessione al server.", "danger");
			console.error("Errore: " + error);
		}
	});
</script>
</body>
</html>
