<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>I miei Ordini - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="ms-auto d-flex align-items-center mt-2 mt-lg-0">

				<div id="nav-guest" class="d-flex w-100">
					<a href="auth.html" class="btn btn-light text-danger fw-bold w-100 shadow-sm">Accedi / Registrati</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2 w-100">
					<a href="homepage.html" class="btn btn-outline-light btn-sm d-flex align-items-center"><i class="bi bi-house me-1"></i> Home</a>

					<div class="dropdown flex-grow-1">
						<button class="btn btn-outline-light btn-sm dropdown-toggle w-100 d-flex align-items-center justify-content-center" type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="nav-menu-dropdown">
							</ul>
					</div>

					<button class="btn btn-light text-danger btn-sm fw-bold shadow-sm" onclick="esci()"><i class="bi bi-box-arrow-right d-lg-none"></i><span class="d-none d-lg-inline"> Esci</span></button>
				</div>

			</div>
		</div>
	</div>
</nav>

<div class="container my-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="fw-bold"><i class="bi bi-bag-check text-danger me-2"></i> I tuoi Acquisti</h2>
		<button class="btn btn-outline-secondary" onclick="caricaStorico()">
			<i class="bi bi-arrow-clockwise"></i> Aggiorna
		</button>
	</div>

	<div id="nessun-ordine" class="alert alert-warning text-center d-none rounded-4 border-0 shadow-sm py-5">
		<i class="bi bi-bag-x fs-1 text-warning d-block mb-3"></i>
		<h4 class="fw-bold">Nessun ordine trovato</h4>
		<p class="mb-3">Non hai ancora effettuato ordini. Che ne dici di provare qualcosa di buono?</p>
		<a href="homepage.html" class="btn btn-danger fw-bold rounded-pill px-4">Sfoglia i Ristoranti</a>
	</div>

	<div class="row g-4" id="griglia-ordini"></div>
</div>

<template id="modello-card-ordine">
	<div class="col-md-6 col-lg-4">
		<div class="card h-100 shadow-sm border-0 rounded-4">
			<div class="card-header bg-white border-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
				<small class="text-muted fw-bold data-ordine"></small>
				<span class="badge rounded-pill stato-badge"></span>
			</div>
			<div class="card-body pt-2">
				<h5 class="fw-bold mb-1 nome-ristorante text-danger"></h5>
				<p class="text-muted small mb-3"><i class="bi bi-geo-alt-fill"></i> <span
						class="indirizzo-ristorante"></span></p>

				<div class="bg-light p-3 rounded-3 mb-3">
					<ul class="list-unstyled mb-0 small lista-piatti"></ul>
				</div>

				<div class="d-flex justify-content-between align-items-center mt-auto border-top pt-3">
					<span class="text-muted small">Totale pagato:</span>
					<h5 class="fw-bold text-success mb-0 totale-ordine"></h5>
				</div>
			</div>
		</div>
	</div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');

	// Blocco accesso a chi non è cliente
	if (!token || ruolo !== 'cliente') {
		window.location.replace('auth.html');
	}

	document.addEventListener('DOMContentLoaded', () => {
		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const menuDropdown = document.getElementById('nav-menu-dropdown');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
					<li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-bag-check me-2"></i> I miei Ordini</a></li>
				`;
			} else if (ruolo === 'ristoratore') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Gestione Menù</a></li>
					<li><a class="dropdown-item" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Ordini Ricevuti</a></li>
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Personale</a></li>
					<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni Locale</a></li>
				`;
			}
		}
	});

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('auth.html');
	}

	function formattaData(dataString) {
		const opzioni = {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'};
		return new Date(dataString).toLocaleString('it-IT', opzioni);
	}

	async function caricaStorico() {
		try {
			const response = await fetch('http://localhost:3000/api/ordini/cliente', {
				headers: {'Authorization': `Bearer ${token}`}
			});

			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
			}

			const ordini = await response.json();
			mostraOrdini(ordini);

		} catch (error) {
			console.error(error);
			alert("Errore di connessione al server.");
		}
	}

	function mostraOrdini(ordini) {
		const griglia = document.getElementById('griglia-ordini');
		const template = document.getElementById('modello-card-ordine');
		const alertNessunOrdine = document.getElementById('nessun-ordine');

		griglia.innerHTML = '';

		if (ordini.length === 0) {
			alertNessunOrdine.classList.remove('d-none');
			return;
		} else {
			alertNessunOrdine.classList.add('d-none');
		}

		ordini.forEach(ordine => {
			const clone = template.content.cloneNode(true);

			// Dati base
			clone.querySelector('.data-ordine').textContent = formattaData(ordine.createdAt);
			clone.querySelector('.nome-ristorante').textContent = ordine.ristorante ? ordine.ristorante.nome : 'Ristorante Rimosso';
			clone.querySelector('.indirizzo-ristorante').textContent = ordine.ristorante ? ordine.ristorante.indirizzo : 'N/A';
			clone.querySelector('.totale-ordine').textContent = `€ ${ordine.totale.toFixed(2)}`;

			// Badge di stato con colori diversi
			const badge = clone.querySelector('.stato-badge');
			if (ordine.stato === 'ordinato') {
				badge.className = 'badge rounded-pill bg-danger';
				badge.textContent = 'INVIATO';
			} else if (ordine.stato === 'in preparazione') {
				badge.className = 'badge rounded-pill bg-warning text-dark';
				badge.textContent = 'IN PREPARAZIONE';
			} else if (ordine.stato === 'consegnato') {
				badge.className = 'badge rounded-pill bg-success';
				badge.textContent = 'CONSEGNATO';
			}

			// Lista piatti
			const ulPiatti = clone.querySelector('.lista-piatti');
			ordine.piatti.forEach(piatto => {
				const li = document.createElement('li');
				li.className = "d-flex justify-content-between border-bottom pb-1 mb-1";
				li.innerHTML = `<span><b>${piatto.quantita}x</b> ${piatto.nome}</span>`;
				ulPiatti.appendChild(li);
			});

			griglia.appendChild(clone);
		});
	}

	document.addEventListener('DOMContentLoaded', caricaStorico);
</script>
</body>
</html>
