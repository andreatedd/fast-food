<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fast Food</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNav">
			<ul class="navbar-nav me-auto">
				<li class="nav-item">
					<a class="nav-link active" href="homepage.html">Home</a>
				</li>
			</ul>

			<div class="d-flex align-items-center">
				<div id="nav-guest" class="d-flex">
					<a href="auth.html" class="btn btn-light text-danger fw-bold">Accedi</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2">
					<div class="dropdown">
						<button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="menu-dropdown">
						</ul>
					</div>
					<button class="btn btn-light text-danger fw-bold" onclick="esci()">Esci</button>
				</div>
			</div>

		</div>
	</div>
</nav>

<div class="bg-danger-subtle py-5 border-bottom border-danger-subtle text-center mb-5">
	<div class="container">
		<h1 class="display-5 fw-bold text-danger mb-3">Trova il fast food perfetto per te</h1>
		<p class="lead text-dark mb-4">Cerca per nome del locale o per città e scopri i menù disponibili.</p>

		<div class="row justify-content-center">
			<div class="col-md-8">
				<form id="formRicerca" class="d-flex bg-white p-2 rounded-pill shadow-sm">
					<select class="form-select border-0 bg-transparent w-auto ms-2" id="tipoRicerca"
					        aria-label="Scegli il tipo di ricerca">
						<option value="nome">Nome</option>
						<option value="luogo">Indirizzo</option>
					</select>

					<div class="vr mx-2"></div>
					<input class="form-control border-0 shadow-none bg-transparent" type="search" id="testoRicerca"
					       placeholder="Cosa stai cercando?" aria-label="Cerca ristorante" required>

					<button class="btn btn-danger rounded-pill px-4" type="submit">
						<i class="bi bi-search"></i> Cerca
					</button>
				</form>
			</div>
		</div>
	</div>
</div>

<div class="container mb-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h3 id="titolo-risultati" class="fw-bold">Ristoranti in Evidenza</h3>
	</div>

	<div id="nessun-risultato" class="alert alert-warning d-none text-center" role="alert">
		<i class="bi bi-emoji-frown fs-4 d-block mb-2"></i>
		Nessun ristorante trovato con questi criteri di ricerca. Prova a cambiare i filtri!
	</div>

	<div class="row g-4" id="griglia-ristoranti"></div>
</div>

<template id="modello-card-ristorante">
	<div class="col-md-6 col-lg-4">
		<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
			<img src="" class="card-img-top object-fit-cover foto-ristorante" alt="..." style="height: 200px;">
			<div class="card-body">
				<h5 class="card-title fw-bold nome-ristorante"></h5>
				<p class="card-text text-muted mb-2">
					<i class="bi bi-geo-alt-fill text-danger"></i> <span class="luogo-ristorante"></span>
				</p>
				<div class="d-flex flex-wrap gap-1 mb-3 categorie-ristorante"></div>
			</div>
			<div class="card-footer bg-white border-0 pt-0 pb-3">
				<a href="#" class="btn btn-outline-danger w-100 btn-vedi-menu">Guarda il Menù</a>
			</div>
		</div>
	</div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	// gestione navbar dinamica
	document.addEventListener('DOMContentLoaded', () => {
		const token = localStorage.getItem('token');
		const ruolo = localStorage.getItem('ruolo');

		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const linkAreaPersonale = document.getElementById('linkAreaPersonale');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				document.getElementById('menu-dropdown').innerHTML = `
                    <li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
                    <li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-receipt me-2"></i> I miei Ordini</a></li>
                `;
			} else if (ruolo === 'ristoratore') {
				document.getElementById('menu-dropdown').innerHTML = `
                    <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Dashboard Locale</a></li>
                    <li><a class="dropdown-item fw-bold text-danger" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Gestione Ordini</a></li>
                    <li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Utente</a></li>
                `;
			}
		}
	});

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.reload();
	}

	let ristorantiDB = [];

	async function caricaRistoranti() {
		try {
			const response = await fetch('http://localhost:3000/api/ristoranti');

			if (!response.ok) {
				document.getElementById('griglia-ristoranti').innerHTML =
					`<div class="alert alert-warning w-100 text-center">Errore del server (${response.status}). Riprova più tardi.</div>`;
				return;
			}

			ristorantiDB = await response.json();
			mostraRistoranti(ristorantiDB);

		} catch (error) {
			console.error("Errore di connessione:", error);
			document.getElementById('griglia-ristoranti').innerHTML =
				'<div class="alert alert-danger w-100 text-center">Impossibile connettersi al server. Assicurati che il backend sia acceso.</div>';
		}
	}

	function mostraRistoranti(ristorantiDaMostrare) {
		const griglia = document.getElementById('griglia-ristoranti');
		const template_rist = document.getElementById('modello-card-ristorante');
		const alertNessunRisultato = document.getElementById('nessun-risultato');
		griglia.innerHTML = '';

		if (ristorantiDaMostrare.length === 0) {
			alertNessunRisultato.classList.remove('d-none');
			return;
		} else {
			alertNessunRisultato.classList.add('d-none');
		}

		ristorantiDaMostrare.forEach(ristorante => {
			const clone = template_rist.content.cloneNode(true);
			const imgFallback = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80";

			clone.querySelector('.foto-ristorante').src = (ristorante.menu && ristorante.menu.length > 0 && ristorante.menu[0].strMealThumb)
				? ristorante.menu[0].strMealThumb
				: imgFallback;
			clone.querySelector('.foto-ristorante').alt = `Foto di ${ristorante.nome}`;
			clone.querySelector('.nome-ristorante').textContent = ristorante.nome;
			clone.querySelector('.luogo-ristorante').textContent = ristorante.indirizzo;

			const contenitoreCategorie = clone.querySelector('.categorie-ristorante');
			let categorieUniche = [];

			if (ristorante.menu && ristorante.menu.length > 0) {
				categorieUniche = [...new Set(ristorante.menu.map(piatto => piatto.strCategory))];
			} else {
				categorieUniche = ["Novità"];
			}

			categorieUniche.forEach(categoria => {
				const badge = document.createElement('span');
				badge.className = 'badge bg-light text-dark border';
				badge.textContent = categoria;
				contenitoreCategorie.appendChild(badge);
			});

			clone.querySelector('.btn-vedi-menu').href = `dettaglio_ristorante.html?id=${ristorante._id}`;
			griglia.appendChild(clone);
		});
	}

	document.addEventListener('DOMContentLoaded', caricaRistoranti);

	document.getElementById('formRicerca').addEventListener('submit', async function (event) {
		event.preventDefault();

		const tipoRicerca = document.getElementById('tipoRicerca').value;
		const testoCercato = document.getElementById('testoRicerca').value.trim();

		let url = 'http://localhost:3000/api/ristoranti';
		if (testoCercato !== "") {
			url += `?${tipoRicerca}=${encodeURIComponent(testoCercato)}`;
		}

		try {
			const response = await fetch(url);
			const risultatiMongoDB = await response.json();

			if (!response.ok) {
				document.getElementById('griglia-ristoranti').innerHTML =
					`<div class="alert alert-warning w-100 text-center">Errore ${response.status}.</div>`;
				return;
			}

			if (testoCercato !== "") {
				document.getElementById('titolo-risultati').textContent = `Risultati per: "${testoCercato}"`;
			} else {
				document.getElementById('titolo-risultati').textContent = "Ristoranti in Evidenza";
			}

			mostraRistoranti(risultatiMongoDB);
		} catch (error) {
			console.error("Errore:", error);
			alert("Impossibile connettersi al server per la ricerca.");
		}
	});
</script>
</body>
</html>
