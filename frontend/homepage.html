<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fast Food App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="ms-auto d-flex align-items-center mt-2 mt-lg-0">

				<div id="nav-guest" class="d-flex w-100">
					<a href="auth.html" class="btn btn-light text-danger fw-bold w-100 shadow-sm">Accedi /
						Registrati</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2 w-100">
					<a href="homepage.html" class="btn btn-outline-light btn-sm d-flex align-items-center"><i
							class="bi bi-house me-1"></i> Home</a>

					<div class="dropdown flex-grow-1">
						<button class="btn btn-outline-light btn-sm dropdown-toggle w-100 d-flex align-items-center justify-content-center"
						        type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="nav-menu-dropdown">
						</ul>
					</div>

					<button class="btn btn-light text-danger btn-sm fw-bold shadow-sm" onclick="esci()"><i
							class="bi bi-box-arrow-right d-lg-none"></i><span class="d-none d-lg-inline"> Esci</span>
					</button>
				</div>

			</div>
		</div>
	</div>
</nav>

<div class="bg-danger-subtle py-5 border-bottom border-danger-subtle text-center mb-5">
	<div class="container">
		<h1 class="display-5 fw-bold text-danger mb-3">Trova il fast food perfetto per te</h1>
		<p class="lead text-dark mb-4">Cerca e scopri i menù disponibili.</p>

		<div class="row justify-content-center">
			<div class="col-md-8">
				<form id="formRicerca" class="d-flex bg-white p-2 rounded-pill shadow-sm">
					<select class="form-select border-0 bg-transparent w-auto ms-2" id="tipoRicerca"
					        aria-label="Scegli il tipo di ricerca">
						<option value="nome">Nome</option>
						<option value="luogo">Indirizzo</option>
					</select>

					<div class="vr mx-2"></div>
					<input class="form-control border-0 shadow-none bg-transparent" type="search" id="testoRicerca"
					       placeholder="Cosa stai cercando?" aria-label="Cerca ristorante" required>

					<button class="btn btn-danger rounded-pill px-4" type="submit">
						<i class="bi bi-search"></i> Cerca
					</button>
				</form>
				<div class="mt-2 text-end">
					<button class="btn btn-sm btn-link text-secondary text-decoration-none" id="btnResetRicerca">
						Mostra tutti i ristoranti
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="container mb-5 d-none" id="sezione-errore">
	<div id="alertBox" class="alert alert-danger text-center shadow-sm rounded-4 border-0" role="alert">
		<i class="bi bi-exclamation-triangle-fill me-2"></i>
		<span id="testoAlert"></span>
	</div>
</div>

<div class="container mb-5 d-none" id="sezione-consigliati">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h3 class="fw-bold text-danger"><i class="bi bi-star-fill me-2 mb-1"></i>Consigliati per te</h3>
	</div>
	<div class="row g-4" id="griglia-consigliati"></div>
	<hr class="mt-5 border-danger-subtle">
</div>

<div class="container mb-5" id="sezione-ristoranti">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h3 id="titolo-risultati" class="fw-bold">Ristoranti in Evidenza</h3>
	</div>

	<div id="nessun-risultato" class="alert alert-warning d-none text-center" role="alert">
		<i class="bi bi-emoji-frown fs-4 d-block mb-2"></i>
		Nessun ristorante trovato con questi criteri di ricerca. Prova a cambiare i filtri!
	</div>

	<div class="row g-4" id="griglia-ristoranti"></div>
	<nav aria-label="Navigazione pagine" class="mt-5 d-none" id="paginazione-container">
		<ul class="pagination justify-content-center" id="paginazione-lista">
		</ul>
	</nav>
</div>

<template id="modello-card-ristorante">
	<div class="col-md-6 col-lg-4">
		<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
			<img src="" class="card-img-top object-fit-cover foto-ristorante" alt="..." style="height: 200px;">
			<div class="card-body">
				<h5 class="card-title fw-bold nome-ristorante"></h5>
				<p class="card-text text-muted mb-2">
					<i class="bi bi-geo-alt-fill text-danger"></i> <span class="luogo-ristorante"></span>
				</p>
				<div class="d-flex flex-wrap gap-1 mb-3 categorie-ristorante"></div>
			</div>
			<div class="card-footer bg-white border-0 pt-0 pb-3">
				<a href="#" class="btn btn-outline-danger w-100 btn-vedi-menu">Guarda il Menù</a>
			</div>
		</div>
	</div>
</template>

<template id="tpl-paginazione-item">
	<li class="page-item">
		<button class="page-link"></button>
	</li>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');

	document.addEventListener('DOMContentLoaded', () => {
		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const menuDropdown = document.getElementById('nav-menu-dropdown');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
					<li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-bag-check me-2"></i> I miei Ordini</a></li>
				`;
			} else if (ruolo === 'ristoratore') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Gestione Menù</a></li>
					<li><a class="dropdown-item" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Ordini Ricevuti</a></li>
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Personale</a></li>
					<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni Locale</a></li>
				`;
			}
		}
	});

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.reload();
	}

	function mostraErrore(messaggio) {
		const alertBox = document.getElementById('sezione-errore');
		const testoAlert = document.getElementById('testoAlert');
		const griglia = document.getElementById('sezione-ristoranti');
		const grigliaConsigliati = document.getElementById('sezione-consigliati');
		const paginazione = document.getElementById('paginazione-container');

		if (messaggio) {
			testoAlert.textContent = messaggio;
			alertBox.classList.remove('d-none');
			griglia.classList.add('d-none');
			grigliaConsigliati.classList.add('d-none');
			paginazione.classList.add('d-none');
		} else {
			alertBox.classList.add('d-none');
			griglia.classList.remove('d-none');
		}
	}

	async function caricaRistoranti(page = 1, searchQuery = "") {
		mostraErrore(null);
		try {
			const url = `http://localhost:3000/api/ristoranti?page=${page}&limit=6${searchQuery}`;
			const response = await fetch(url);

			if (!response.ok) {
				const errorData = await response.json().catch(() => ({}));
				mostraErrore(errorData.message || "Errore durante il caricamento dei ristoranti.");
				console.error(errorData);
				return;
			}

			const dati = await response.json();

			// Mostra consigliati solo se pag.1 e nessuna ricerca attiva
			if (token && ruolo === 'cliente' && page === 1 && searchQuery === "") {
				await elaboraConsigliati();
			} else {
				document.getElementById('sezione-consigliati').classList.add('d-none');
			}

			mostraRistoranti(dati.ristoranti, 'griglia-ristoranti');
			creaPaginazione(dati.currentPage, dati.totalPages, searchQuery);

		} catch (error) {
			console.error("Errore: ", error);
			mostraErrore("Impossibile connettersi al server.")
		}
	}

	function creaPaginazione(currentPage, totalPages, searchQuery) {
		const container = document.getElementById('paginazione-container');
		const lista = document.getElementById('paginazione-lista');
		const template = document.getElementById('tpl-paginazione-item');
		lista.innerHTML = '';

		if (totalPages <= 1) {
			container.classList.add('d-none');
			return;
		}

		container.classList.remove('d-none');

		// helper per creare un button
		function creaButton(testo, paginaDestinazione, disabilitato, attivo) {
			const clone = template.content.cloneNode(true);
			const li = clone.querySelector('.page-item');
			const button = clone.querySelector('.page-link');

			button.innerHTML = testo;

			if (disabilitato) {
				li.classList.add('disabled');
				button.classList.add('text-danger');
			} else if (attivo) {
				li.classList.add('active');
				button.classList.add('bg-danger', 'border-danger', 'text-white');
			} else {
				button.classList.add('text-danger');
				button.addEventListener('click', () => caricaRistoranti(paginaDestinazione, searchQuery));
			}
			lista.appendChild(clone);
		}

		creaButton('&laquo; Precedente', currentPage - 1, currentPage === 1, false);
		// button numeri
		for (let i = 1; i <= totalPages; i++) {
			creaButton(i, i, false, currentPage === i);
		}
		creaButton('Successivo &raquo;', currentPage + 1, currentPage === totalPages, false);
	}

	async function elaboraConsigliati() {
		try {
			const response = await fetch('http://localhost:3000/api/ristoranti/consigliati', {
				headers: {'Authorization': `Bearer ${token}`}
			});
			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
				const errorData = await response.json().catch(() => ({}));
				document.getElementById('sezione-consigliati').classList.add('d-none');
				console.error("Errore caricamento consigliati:", errorData);
				return;
			}
			const ristorantiConsigliati = await response.json();

			if (ristorantiConsigliati.length > 0) {
				document.getElementById('sezione-consigliati').classList.remove('d-none');
				mostraRistoranti(ristorantiConsigliati, 'griglia-consigliati');
			} else {
				document.getElementById('sezione-consigliati').classList.add('d-none');
			}
		} catch (err) {
			console.error("Errore:", err);
			document.getElementById('sezione-consigliati').classList.add('d-none');
		}
	}

	function mostraRistoranti(ristorantiDaMostrare, targetId) {
		const griglia = document.getElementById(targetId);
		const template_rist = document.getElementById('modello-card-ristorante');
		griglia.innerHTML = '';

		if (targetId === 'griglia-ristoranti') {
			const alertNessunRisultato = document.getElementById('nessun-risultato');
			if (ristorantiDaMostrare.length === 0) {
				alertNessunRisultato.classList.remove('d-none');
				return;
			} else {
				alertNessunRisultato.classList.add('d-none');
			}
		}

		ristorantiDaMostrare.forEach(ristorante => {
			const clone = template_rist.content.cloneNode(true);
			const imgFallback = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80";
			clone.querySelector('.foto-ristorante').src = ristorante.menu?.[0]?.strMealThumb || imgFallback;
			clone.querySelector('.foto-ristorante').alt = `Foto di ${ristorante.nome}`;
			clone.querySelector('.nome-ristorante').textContent = ristorante.nome;
			clone.querySelector('.luogo-ristorante').textContent = ristorante.indirizzo;

			const contenitoreCategorie = clone.querySelector('.categorie-ristorante');
			let categorieUniche = [];
			if (ristorante.menu && ristorante.menu.length > 0) {
				categorieUniche = [...new Set(ristorante.menu.map(piatto => piatto.strCategory))];
			} else {
				categorieUniche = ["Novità"];
			}

			const maxCategorie = 3;
			const categorieDaMostrare = categorieUniche.slice(0, maxCategorie);
			categorieDaMostrare.forEach(categoria => {
				const badge = document.createElement('span');
				badge.className = 'badge bg-light text-dark border';
				badge.textContent = categoria;
				contenitoreCategorie.appendChild(badge);
			});

			clone.querySelector('.btn-vedi-menu').href = `dettaglio_ristorante.html?id=${ristorante._id}`;
			griglia.appendChild(clone);
		});
	}

	document.addEventListener('DOMContentLoaded', () => caricaRistoranti(1, ""));

	// ricerca
	document.getElementById('formRicerca').addEventListener('submit', function (event) {
		event.preventDefault();
		const tipoRicerca = document.getElementById('tipoRicerca').value;
		const testoCercato = document.getElementById('testoRicerca').value.trim();

		let searchQuery = "";
		if (testoCercato !== "") {
			searchQuery = `&${tipoRicerca}=${encodeURIComponent(testoCercato)}`;
			document.getElementById('titolo-risultati').textContent = `Risultati per: "${testoCercato}"`;
		} else {
			document.getElementById('titolo-risultati').textContent = "Ristoranti in Evidenza";
		}

		caricaRistoranti(1, searchQuery);
	});

	// reset ricerca
	document.getElementById('btnResetRicerca').addEventListener('click', (e) => {
		e.preventDefault();
		document.getElementById('formRicerca').reset();
		document.getElementById('titolo-risultati').textContent = "Ristoranti in Evidenza";

		caricaRistoranti(1, "");
	});
</script>
</body>
</html>
