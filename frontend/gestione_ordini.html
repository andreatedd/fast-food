<!DOCTYPE html>
<html lang="it-IT">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestione Ordini - FastFood App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="homepage.html">
			<i class="bi bi-shop"></i> FastFood App
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="ms-auto d-flex align-items-center mt-2 mt-lg-0">

				<div id="nav-guest" class="d-flex w-100">
					<a href="auth.html" class="btn btn-light text-danger fw-bold w-100 shadow-sm">Accedi /
						Registrati</a>
				</div>

				<div id="nav-user" class="d-flex d-none gap-2 w-100">
					<a href="homepage.html" class="btn btn-outline-light btn-sm d-flex align-items-center"><i
							class="bi bi-house me-1"></i> Home</a>

					<div class="dropdown flex-grow-1">
						<button class="btn btn-outline-light btn-sm dropdown-toggle w-100 d-flex align-items-center justify-content-center"
						        type="button" data-bs-toggle="dropdown">
							<i class="bi bi-person-circle me-1"></i> Area Personale
						</button>
						<ul class="dropdown-menu dropdown-menu-end shadow" id="nav-menu-dropdown">
						</ul>
					</div>

					<button class="btn btn-light text-danger btn-sm fw-bold shadow-sm" onclick="esci()"><i
							class="bi bi-box-arrow-right d-lg-none"></i><span class="d-none d-lg-inline"> Esci</span>
					</button>
				</div>

			</div>
		</div>
	</div>
</nav>

<div class="container mt-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="fw-bold">Ordini in arrivo</h2>
		<button class="btn btn-outline-secondary" onclick="caricaOrdini()">
			<i class="bi bi-arrow-clockwise"></i> Aggiorna
		</button>
	</div>

	<ul class="nav nav-tabs mb-4" id="filtriOrdini" role="tablist">
		<li class="nav-item" role="presentation">
			<button class="nav-link active text-danger fw-bold" id="tab-attivi" data-bs-toggle="tab"
			        data-bs-target="#attivi" type="button" role="tab">Da Preparare / In Corso
			</button>
		</li>
		<li class="nav-item" role="presentation">
			<button class="nav-link text-secondary fw-bold" id="tab-storico" data-bs-toggle="tab"
			        data-bs-target="#storico" type="button" role="tab">Storico (Consegnati)
			</button>
		</li>
	</ul>

	<div class="tab-content" id="ordiniTabContent">
		<div class="tab-pane fade show active" id="attivi" role="tabpanel">
			<div id="nessun-ordine-attivo"
			     class="alert alert-success text-center d-none rounded-4 border-0 shadow-sm py-5">
				<i class="bi bi-check-circle fs-1 text-success d-block mb-3"></i>
				<h4 class="fw-bold">Ottimo lavoro!</h4>
				<p class="mb-0">Non ci sono ordini in coda al momento.</p>
			</div>
			<div class="row g-4" id="griglia-ordini-attivi"></div>
		</div>

		<div class="tab-pane fade" id="storico" role="tabpanel">
			<div class="row g-4" id="griglia-ordini-storico"></div>
		</div>
	</div>
</div>

<template id="modello-card-ordine">
	<div class="col-md-6 col-lg-4">
		<div class="card h-100 shadow-sm border-0 rounded-4 border-top border-4">
			<div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
				<span class="badge rounded-pill fs-6 stato-badge"></span>
				<small class="text-muted fw-bold data-ordine"></small>
			</div>
			<div class="card-body">
				<h5 class="fw-bold mb-1 nome-cliente"></h5>
				<p class="text-muted small mb-3"><i class="bi bi-envelope"></i> <span class="email-cliente"></span></p>

				<div class="bg-light p-3 rounded-3 mb-3">
					<h6 class="fw-bold mb-2 small text-uppercase">Riepilogo Piatti</h6>
					<ul class="list-unstyled mb-0 small lista-piatti"></ul>
				</div>

				<h5 class="text-end fw-bold text-success mb-0 totale-ordine"></h5>
			</div>
			<div class="card-footer bg-white border-0 pb-4 text-center contenitore-azioni">
			</div>
		</div>
	</div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
	const token = localStorage.getItem('token');
	const ruolo = localStorage.getItem('ruolo');

	if (!token || ruolo !== 'ristoratore') {
		window.location.replace('auth.html');
	}

	document.addEventListener('DOMContentLoaded', () => {
		const navGuest = document.getElementById('nav-guest');
		const navUser = document.getElementById('nav-user');
		const menuDropdown = document.getElementById('nav-menu-dropdown');

		if (token && ruolo) {
			navGuest.classList.add('d-none');
			navUser.classList.remove('d-none');

			if (ruolo === 'cliente') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Il mio Profilo</a></li>
					<li><a class="dropdown-item" href="storico_ordini.html"><i class="bi bi-bag-check me-2"></i> I miei Ordini</a></li>
				`;
			} else if (ruolo === 'ristoratore') {
				menuDropdown.innerHTML = `
					<li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-shop me-2"></i> Gestione Menù</a></li>
					<li><a class="dropdown-item" href="gestione_ordini.html"><i class="bi bi-receipt me-2"></i> Ordini Ricevuti</a></li>
					<li><a class="dropdown-item" href="profilo_utente.html"><i class="bi bi-person me-2"></i> Profilo Personale</a></li>
					<li><a class="dropdown-item" href="crea_ristorante.html"><i class="bi bi-gear me-2"></i> Impostazioni Locale</a></li>
				`;
			}
		}
	});

	function esci() {
		localStorage.removeItem('token');
		localStorage.removeItem('ruolo');
		window.location.replace('auth.html');
	}

	// Formattazione data
	function formattaData(dataString) {
		const opzioni = {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'};
		return new Date(dataString).toLocaleString('it-IT', opzioni);
	}

	async function caricaOrdini(filtro) {
		try {
			// Costruisci l'URL in base al filtro richiesto
			const url = `http://localhost:3000/api/ordini/ristorante?filtro=${filtro}`;
			const response = await fetch(url, {
				headers: {'Authorization': `Bearer ${token}`}
			});

			if (!response.ok) {
				if (response.status === 401) {
					alert("Sessione scaduta. Effettua nuovamente l'accesso.");
					esci();
					return;
				}
				throw new Error("Errore nel recupero dati");
			}

			const ordini = await response.json();
			// Chiama una funzione di rendering specifica in base al filtro
			if (filtro === 'attivi') {
				mostraOrdiniAttivi(ordini);
			} else if (filtro === 'storico') {
				mostraOrdiniStorico(ordini);
			}

		} catch (error) {
			console.error(error);
			alert("Errore di connessione al server.");
		}
	}

	// Funzione per il rendering SOLO degli ordini ATTIVI
	function mostraOrdiniAttivi(ordini) {
		const grigliaAttivi = document.getElementById('griglia-ordini-attivi');
		const template = document.getElementById('modello-card-ordine');
		const alertNessunAttivo = document.getElementById('nessun-ordine-attivo');

		grigliaAttivi.innerHTML = '';
		let contatoreAttivi = 0;

		ordini.forEach(ordine => {
			const clone = template.content.cloneNode(true);
			const card = clone.querySelector('.card');

			compilaDatiBase(clone, ordine); // Funzione di supporto (vedi giù)

			const badge = clone.querySelector('.stato-badge');
			const contenitoreAzioni = clone.querySelector('.contenitore-azioni');

			if (ordine.stato === 'ordinato') {
				contatoreAttivi++;
				card.classList.add('border-danger');
				badge.className = 'badge rounded-pill fs-6 bg-danger';
				badge.textContent = 'NUOVO ORDINE';

				const btnPrepara = document.createElement('button');
				btnPrepara.className = 'btn btn-danger w-100 fw-bold shadow-sm';
				btnPrepara.innerHTML = '<i class="bi bi-fire me-2"></i> Inizia Preparazione';
				btnPrepara.onclick = () => cambiaStatoOrdine(ordine._id, 'in preparazione');
				contenitoreAzioni.appendChild(btnPrepara);

				grigliaAttivi.appendChild(clone);

			} else if (ordine.stato === 'in preparazione') {
				contatoreAttivi++;
				card.classList.add('border-warning');
				badge.className = 'badge rounded-pill fs-6 bg-warning text-dark';
				badge.textContent = 'IN PREPARAZIONE';

				const btnConsegna = document.createElement('button');
				btnConsegna.className = 'btn btn-success w-100 fw-bold shadow-sm';
				btnConsegna.innerHTML = '<i class="bi bi-box-seam-fill me-2"></i> Segna come Consegnato';
				btnConsegna.onclick = () => cambiaStatoOrdine(ordine._id, 'consegnato');
				contenitoreAzioni.appendChild(btnConsegna);

				grigliaAttivi.appendChild(clone);
			}
		});

		if (contatoreAttivi === 0) {
			alertNessunAttivo.classList.remove('d-none');
		} else {
			alertNessunAttivo.classList.add('d-none');
		}
	}

	// Funzione per il rendering SOLO dello STORICO
	function mostraOrdiniStorico(ordini) {
		const grigliaStorico = document.getElementById('griglia-ordini-storico');
		const template = document.getElementById('modello-card-ordine');
		grigliaStorico.innerHTML = '';

		ordini.forEach(ordine => {
			const clone = template.content.cloneNode(true);
			const card = clone.querySelector('.card');

			compilaDatiBase(clone, ordine); // Funzione di supporto (vedi giù)

			const badge = clone.querySelector('.stato-badge');
			const contenitoreAzioni = clone.querySelector('.contenitore-azioni');

			card.classList.add('border-secondary');
			card.classList.add('opacity-75');
			badge.className = 'badge rounded-pill fs-6 bg-secondary';
			badge.textContent = 'CONSEGNATO';
			contenitoreAzioni.innerHTML = '<span class="text-success fw-bold"><i class="bi bi-check2-all"></i> Ordine Completato</span>';

			grigliaStorico.appendChild(clone);
		});
	}

	// Funzione helper per non ripetere il codice
	function compilaDatiBase(clone, ordine) {
		clone.querySelector('.data-ordine').textContent = formattaData(ordine.createdAt);
		clone.querySelector('.nome-cliente').textContent = ordine.cliente ? `${ordine.cliente.nome} ${ordine.cliente.cognome}` : 'Cliente Eliminato';
		clone.querySelector('.email-cliente').textContent = ordine.cliente ? ordine.cliente.email : 'N/A';
		clone.querySelector('.totale-ordine').textContent = `Totale: € ${ordine.totale.toFixed(2)}`;

		const ulPiatti = clone.querySelector('.lista-piatti');
		ordine.piatti.forEach(piatto => {
			const li = document.createElement('li');
			li.className = "d-flex justify-content-between border-bottom pb-1 mb-1";
			li.innerHTML = `<span><b>${piatto.quantita}x</b> ${piatto.nome}</span> <span>€ ${(piatto.prezzo * piatto.quantita).toFixed(2)}</span>`;
			ulPiatti.appendChild(li);
		});
	}

	// Cambia stato dell'ordine (PUT) (Rimane invariato, tranne il refresh)
	async function cambiaStatoOrdine(idOrdine, nuovoStato) {
		try {
			const response = await fetch(`http://localhost:3000/api/ordini/${idOrdine}/stato`, {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify({stato: nuovoStato})
			});

			if (!response.ok) {
				const errorData = await response.json();
				alert("Errore: " + (errorData.message || "Impossibile aggiornare lo stato."));
				return;
			}

			// Ricarichiamo SOLO gli ordini attivi, per fluidità!
			await caricaOrdini('attivi');

		} catch (error) {
			console.error(error);
		}
	}

	// all'avvio carica ordini attivi (tab attivi di default)
	document.addEventListener('DOMContentLoaded', () => {
		caricaOrdini('attivi');
	});

	// cambio tab su storico
	document.getElementById('tab-storico').addEventListener('click', () => {
		caricaOrdini('storico');
	});

	// cambio tab su attivi
	document.getElementById('tab-attivi').addEventListener('click', () => {
		caricaOrdini('attivi');
	});

	// aggiornamento
	document.querySelector('button[onclick="caricaOrdini()"]').onclick = (e) => {
		e.preventDefault();
		const tabAttiva = document.querySelector('.nav-link.active').id;
		if(tabAttiva === 'tab-attivi') {
			caricaOrdini('attivi');
		} else {
			caricaOrdini('storico');
		}
	};
</script>
</body>
</html>
