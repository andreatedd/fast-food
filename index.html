<!DOCTYPE html>
<html lang="it-IT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food - Ordina a domicilio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        /* Un piccolo tocco di stile per l'immagine di copertina */
        .hero-section {
            background-color: #f8d7da; /* Rosso molto chiaro per richiamare il tema fast food */
            padding: 80px 0;
            border-bottom: 1px solid #f5c2c7;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-shop"></i> FastFood App
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
            </ul>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2">Accedi</button>
                <button class="btn btn-light text-danger fw-bold">Registrati</button>
            </div>
        </div>
    </div>
</nav>

<div class="hero-section text-center mb-5">
    <div class="container">
        <h1 class="display-5 fw-bold text-danger mb-3">Trova il fast food perfetto per te</h1>
        <p class="lead text-dark mb-4">Cerca per nome del locale o per città e scopri i menù disponibili.</p>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="formRicerca" class="d-flex bg-white p-2 rounded-pill shadow-sm">
                    <select class="form-select border-0 bg-transparent w-auto ms-2" id="tipoRicerca" style="max-width: 150px; cursor: pointer;">
                        <option value="nome">Nome</option>
                        <option value="luogo">Città</option>
                    </select>

                    <div class="vr mx-2"></div> <input class="form-control border-0 shadow-none bg-transparent" type="search" id="testoRicerca" placeholder="Cosa stai cercando?" required>

                    <button class="btn btn-danger rounded-pill px-4" type="submit">
                        <i class="bi bi-search"></i> Cerca
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 id="titolo-risultati">Tutti i Ristoranti</h3>
    </div>

    <div id="nessun-risultato" class="alert alert-warning d-none text-center" role="alert">
        <i class="bi bi-emoji-frown fs-4 d-block mb-2"></i>
        Nessun ristorante trovato con questi criteri di ricerca. Prova a cambiare i filtri!
    </div>

    <div class="row g-4" id="griglia-ristoranti"></div>
</div>

<template id="modello-card-ristorante">
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0">
            <img src="" class="card-img-top foto-ristorante" alt="..." style="height: 200px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title fw-bold nome-ristorante"></h5>
                <p class="card-text text-muted mb-2">
                    <i class="bi bi-geo-alt-fill text-danger"></i> <span class="luogo-ristorante"></span>
                </p>
                <div class="d-flex flex-wrap gap-1 mb-3 categorie-ristorante">
                    </div>
            </div>
            <div class="card-footer bg-white border-0 pt-0">
                <a href="#" class="btn btn-outline-danger w-100 btn-vedi-menu">Guarda il Menù</a>
            </div>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script>
    // 1. Array di Dati "Fittizi" (Mock) per simulare il Database
    // Quando faremo il backend, questi dati arriveranno tramite una fetch() da MongoDB
    const ristorantiDB = [
        {
            id: 1,
            nome: "Burger King",
            luogo: "Milano",
            immagine: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=600&q=80",
            categorie: ["Hamburger", "Fast Food"]
        },
        {
            id: 2,
            nome: "Pizzeria Da Michele",
            luogo: "Napoli",
            immagine: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=600&q=80",
            categorie: ["Pizza", "Italiana"]
        },
        {
            id: 3,
            nome: "Sushi Zen",
            luogo: "Milano",
            immagine: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80",
            categorie: ["Sushi", "Giapponese"]
        },
        {
            id: 4,
            nome: "Smash Burger Burger",
            luogo: "Roma",
            immagine: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80",
            categorie: ["Hamburger", "Americano"]
        }
    ];

    // 2. Funzione per mostrare i ristoranti a schermo
    function mostraRistoranti(ristorantiDaMostrare) {
        const griglia = document.getElementById('griglia-ristoranti');
        const template = document.getElementById('modello-card-ristorante');
        const alertNessunRisultato = document.getElementById('nessun-risultato');

        // Svuotiamo la griglia
        griglia.innerHTML = '';

        // Gestiamo il caso in cui l'array sia vuoto (es. ricerca fallita)
        if (ristorantiDaMostrare.length === 0) {
            alertNessunRisultato.classList.remove('d-none');
            return;
        } else {
            alertNessunRisultato.classList.add('d-none');
        }

        // Cloniamo il template per ogni ristorante
        ristorantiDaMostrare.forEach(ristorante => {
            const clone = template.content.cloneNode(true);

            clone.querySelector('.foto-ristorante').src = ristorante.immagine;
            clone.querySelector('.foto-ristorante').alt = `Foto di ${ristorante.nome}`;
            clone.querySelector('.nome-ristorante').textContent = ristorante.nome;
            clone.querySelector('.luogo-ristorante').textContent = ristorante.luogo;

            // Creiamo dinamicamente i badge per le categorie
            const contenitoreCategorie = clone.querySelector('.categorie-ristorante');
            ristorante.categorie.forEach(categoria => {
                const badge = document.createElement('span');
                badge.className = 'badge bg-light text-dark border';
                badge.textContent = categoria;
                contenitoreCategorie.appendChild(badge);
            });

            // Impostiamo un comportamento di base al bottone "Guarda il Menu"
            clone.querySelector('.btn-vedi-menu').addEventListener('click', (e) => {
                e.preventDefault();
                alert(`Hai cliccato per vedere il menù di: ${ristorante.nome} (ID: ${ristorante.id})`);
                // In futuro qui faremo un redirect alla pagina del menù specifico
            });

            griglia.appendChild(clone);
        });
    }

    // 3. Mostriamo tutti i ristoranti al caricamento della pagina
    mostraRistoranti(ristorantiDB);

    // 4. Implementiamo la logica del form di ricerca
    document.getElementById('formRicerca').addEventListener('submit', function(event) {
        event.preventDefault();

        // Raccogliamo i valori dal form
        const tipoRicerca = document.getElementById('tipoRicerca').value; // "nome" o "luogo"
        const testoCercato = document.getElementById('testoRicerca').value.toLowerCase().trim();

        // Filtriamo l'array in base al tipo di ricerca scelto dall'utente
        const risultatiCercati = ristorantiDB.filter(ristorante => {
            if (tipoRicerca === 'nome') {
                return ristorante.nome.toLowerCase().includes(testoCercato);
            } else if (tipoRicerca === 'luogo') {
                return ristorante.luogo.toLowerCase().includes(testoCercato);
            }
        });

        // Cambiamo il titolo e mostriamo i risultati
        document.getElementById('titolo-risultati').textContent = `Risultati per: "${document.getElementById('testoRicerca').value}"`;
        mostraRistoranti(risultatiCercati);
    });
</script>
</body>
</html>
