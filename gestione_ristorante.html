<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Gestione ristorante</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	<div class="container-fluid">
		<a href="#" class="navbar-brand mb-0 h1">Fast Food - Area Ristoratore</a>
		<div class="dropdown">
			<button class="btn btn-outline-light dropdown-toggle" type="button" id="userMenuButton"
			        data-bs-toggle="dropdown" aria-expanded="false">
				<i class="bi bi-person-circle me-1"></i> Area Ristoratore
			</button>
			<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuButton">
				<li><a class="dropdown-item" href="#">Sito Pubblico</a></li>
				<li><a class="dropdown-item" href="#">Gestione Ordini</a></li>
				<li>
					<hr class="dropdown-divider">
				</li>
				<li><a class="dropdown-item text-danger" href="#">Logout</a></li>
			</ul>
		</div>
	</div>
</nav>
<div class="container mt-5">
	<h2 class="mb-4">Gestione Ristorante</h2>

	<!-- Intestazione delle Schede -->
	<ul class="nav nav-tabs" id="dashboardTabs">
		<li class="nav-item">
			<button class="nav-link active" id="profilo-tab" data-bs-toggle="tab" data-bs-target="#profilo-pane"
			        type="button">Profilo Ristorante
			</button>
		</li>
		<li class="nav-item">
			<button class="nav-link" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu-pane" type="button">Gestione Menù
			</button>
		</li>
	</ul>

	<!-- Contenuto delle Schede -->
	<div class="tab-content" id="dashboardTabsContent">

		<!-- SCHEDA 1: PROFILO -->
		<div class="tab-pane fade show active p-4 border border-top-0 rounded-bottom bg-white" id="profilo-pane"
		    tabindex="0">
			<h4 class="mb-3">Informazioni Generali</h4>
			<!-- Qui andrà il form con i dati del ristorante -->
		</div>

		<!-- SCHEDA 2: MENU -->
		<div class="tab-pane fade p-4 border border-top-0 rounded-bottom bg-white" id="menu-pane"
		     tabindex="0">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h4 class="m-0">I tuoi piatti</h4>
				<div>
					<!-- Qui andranno i pulsanti per aggiungere piatti -->
				</div>
			</div>
			<!-- Qui andrà la griglia con i piatti inseriti -->
		</div>

	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
